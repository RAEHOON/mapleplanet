<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정산하기</title>
  <meta name="description" content="사냥 아이템 판매금을 경매장 수수료·택배비까지 빼고 전원 똑같이 나눕니다. 분배자가 부담하는 택배 수수료까지 계산합니다.">
  <meta property="og:title" content="정산하기">
  <meta property="og:description" content="경매장 수수료와 택배비까지 빼고 전원 똑같이 나눕니다.">
  <meta name="theme-color" content="#1c1813">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ============================================================
       디자인 토큰 — 계산기·타이머와 같은 값을 씁니다.
       ============================================================ */
    :root {
      --paper-deep: #1c1813;   /* 지면 바탕 */
      --paper:      #262019;   /* 카드·패널 */
      --paper-in:   #100d09;   /* 입력칸 */
      --paper-band: #332c22;   /* 강조 행 */
      --paper-warm: #2f2820;   /* 보조 상자 */

      --ink:        #f6edd8;
      --ink-mid:    #c3b492;
      --ink-soft:   #9b8a6a;
      --ink-faint:  #6f6249;

      --line:       #6a5c46;   /* 테두리 */
      --rule:       #443a2c;   /* 가는 괘선 */
      --gold:       #dcbb4c;   /* 금박 — 굵은 괘선과 주 버튼 */

      --seal:       #cc5f42;   /* 인장 주홍 */
      --seal-bg:    #3a201a;

      /* 이 페이지의 낯색 — 청자 */
      --celadon:    #8fc0a0;
      --market:     #d1a06a;

      --font-ui:    'Gulim', '굴림', 'Malgun Gothic', sans-serif;
      --font-num:   'Gulim', '굴림', 'Malgun Gothic', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px 16px 12px;
      font-family: var(--font-ui);
      color: var(--ink);
      background: var(--paper-deep);
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;   /* 한국어를 단어 중간에서 끊지 않습니다 */
    }

    .wrap { max-width: 1080px; margin: 0 auto; }

    /* 숫자는 고정폭이라 자릿수가 흔들리지 않습니다. */
    .num, input[type="text"], .n {
      font-family: var(--font-num);
      font-variant-numeric: tabular-nums lining-nums;
      font-feature-settings: "tnum" 1;
    }

    /* ============================================================
       머리
       ============================================================ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .home {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 16px;
      border: 2px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
    }
    .home:hover { background: var(--line); color: var(--ink); }
    .home:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }

    .eyebrow {
      font-size: 13px;
      color: var(--ink-soft);
      letter-spacing: .18em;
    }

    /* 결과까지 한 화면에 들어오도록 다른 도구보다 표제부를 낮게 잡습니다 */
    header {
      text-align: center;
      border-top: 4px solid var(--gold);
      border-bottom: 4px solid var(--gold);
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      padding: 9px 8px 5px;
      border-bottom: 1px solid var(--line);
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 800;
      letter-spacing: .12em;
      text-wrap: balance;
    }

    .subtitle {
      margin: 0;
      padding: 5px 8px 8px;
      color: var(--ink-mid);
      font-size: 12px;
      letter-spacing: .02em;
    }

    /* ============================================================
       입력 카드
       ============================================================ */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
      gap: 14px;
      margin-bottom: 10px;
      align-items: start;
    }

    /* 넓은 화면에서는 세 카드가 한 줄 — 아이템 카드가 남는 폭을 씁니다 */
    @media (min-width: 920px) {
      .cards { grid-template-columns: 272px 272px 1fr; }
    }

    .card {
      --accent: var(--ink);
      background: var(--paper);
      border: 2px solid var(--line);
      border-top: 9px solid var(--accent);
      padding: 12px 14px 13px;
    }

    .card h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--accent);
    }

    /* 수수료 카드 — 2×2 미니 격자 (라벨을 입력칸 위에) */
    .mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px 10px;
      margin-top: 9px;
    }
    .mini label { display: block; font-size: 12px; color: var(--ink-mid); margin-bottom: 3px; }
    .mini .mrow { display: flex; align-items: center; gap: 5px; }
    .mini .unit { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

    .card .fee {
      margin: 5px 0 0;
      padding-bottom: 9px;
      border-bottom: 2px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
    }

    /* 라벨 / 입력 / 단위 */
    .field {
      display: grid;
      grid-template-columns: 1fr 116px 46px;
      align-items: center;
      gap: 9px;
      margin-top: 6px;
    }

    /* 분배 카드 — 인원·절사 단위는 두세 자리면 충분해 칸을 좁힙니다 */
    .card.dist .field { grid-template-columns: 1fr 62px 46px; }
    .field > label { font-size: 13px; color: var(--ink-mid); }
    .field > .unit { font-size: 12px; color: var(--ink-soft); }

    input[type="text"] {
      width: 100%;
      min-height: 44px;
      padding: 8px 11px;
      text-align: right;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      background: var(--paper-in);
      border: 2px solid var(--line);
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--seal);
      box-shadow: inset 0 0 0 2px var(--seal-bg);
    }
    input.bad { border-color: var(--seal); background: var(--seal-bg); }

    /* 카드 하단 요약 상자 */
    .note {
      margin: 9px 0 0;
      padding: 7px 11px;
      border: 2px solid var(--accent);
      background: var(--paper-warm);
      font-family: var(--font-num);
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }
    .note:empty { display: none; }

    /* ============================================================
       버튼
       ============================================================ */
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin: 0 0 12px; }

    .btn {
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      min-height: 44px;
      padding: 9px 19px;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: var(--paper-band); }
    .btn:active { background: var(--line); color: var(--ink); }
    .btn:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
    .btn.primary { background: var(--gold); color: var(--paper-in); border-color: var(--gold); }
    .btn.primary:hover { background: #392f22; }

    /* ============================================================
       패널 (아이템 표 · 결과)
       ============================================================ */
    .panel {
      background: var(--paper);
      border: 2px solid var(--line);
      padding: 13px 16px 14px;
      margin-bottom: 14px;
    }

    .panel > h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .panel > h2::before {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--gold);
      flex-shrink: 0;
    }

    .panel > .hint {
      margin: 9px 0 0;
      padding-bottom: 11px;
      border-bottom: 4px solid var(--gold);
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.7;
    }

    /* 아이템 줄 — 판매가를 억·만·메소 세 칸으로 나눠 받습니다.
       좁은 화면에서는 이름이 윗줄, 금액이 아랫줄로 접힙니다. */
    .irow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.2fr) auto minmax(0, 1.3fr) 44px 44px;
      gap: 5px;
      align-items: center;
      margin-top: 9px;
    }
    .irow .iname { grid-column: 1 / -1; }

    @media (min-width: 920px) {
      .irow {
        grid-template-columns: minmax(0, 1fr) 52px auto 64px auto 70px 44px 44px;
      }
      .irow .iname { grid-column: auto; }
    }

    /* 금액 칸 사이의 단위 글자 */
    .u { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }

    /* 가위값 — 만·메소 두 칸 (억 단위까지 갈 일이 없습니다) */
    .field-3 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 72px auto 76px;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
    }
    .field-3 > label { font-size: 13px; color: var(--ink-mid); }
    .field-3 input[type="text"] { font-size: 16px; padding-left: 6px; padding-right: 6px; }

    /* 가위 표시 — 짤라서 판 아이템 (가위값을 나눌 금액에서 뺍니다) */
    .cut {
      min-width: 44px;
      min-height: 44px;
      background: none;
      border: 2px solid var(--line);
      color: var(--ink-faint);
      font-size: 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cut:hover { border-color: var(--seal); color: var(--seal); }
    .cut.on { background: var(--seal); border-color: var(--seal); color: var(--paper-in); }
    .cut:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
    .irow input[type="text"] { font-size: 16px; padding-left: 6px; padding-right: 6px; }
    .irow input.name {
      text-align: left;
      font-family: var(--font-ui);
      font-size: 16px; /* 16px 미만이면 iOS가 탭할 때 화면을 강제 확대한다 */
    }

    .row-tools { display: flex; gap: 8px; margin-top: 10px; }
    .row-tools .btn { flex: 1 1 auto; padding: 6px 8px; font-size: 14px; }

    .del {
      min-width: 44px;
      min-height: 44px;
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 18px;
      cursor: pointer;
    }
    .del:hover { color: var(--seal); background: var(--seal-bg); }
    .del:focus-visible { outline: 3px solid var(--seal); outline-offset: -2px; }

    /* ============================================================
       결과
       ============================================================ */
    #out .section { margin-top: 8px; }

    /* 결과 머리줄 오른쪽의 작은 버튼 (결과 복사 · 입력 지우기) */
    .h2-tools { margin-left: auto; display: flex; gap: 7px; }
    .h2-tools .btn {
      min-height: 44px; /* 손가락 터치 최소 크기 — 마우스 환경은 아래 920px 블록에서 낮춘다 */
      padding: 3px 12px;
      font-size: 13px;
      letter-spacing: 0;
    }

    /* 넓은 화면에서는 결과 네 절을 2단으로 — 한 화면에 다 들어오게 */
    @media (min-width: 920px) {
      #out {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 30px;
        align-items: start;
      }
      #out > .notice, #out > .error { grid-column: 1 / -1; }
    }

    #out h3 {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin: 0 0 2px;
      padding-bottom: 5px;
      border-bottom: 2px solid var(--line);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .06em;
    }
    #out h3 .no { color: var(--seal); letter-spacing: .1em; }
    #out h3 .sub {
      font-weight: 400;
      font-size: 12px;
      color: var(--ink-soft);
      letter-spacing: 0;
    }

    .r {
      display: grid;
      gap: 3px 14px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--rule);
      font-family: var(--font-num);
      font-variant-numeric: tabular-nums lining-nums;
      font-size: 15px;
      align-items: baseline;
    }
    .r:last-child { border-bottom: none; }
    .r .lbl { font-family: var(--font-ui); font-size: 14px; color: var(--ink); white-space: nowrap; }
    .r .num { text-align: right; }
    .r .sub { color: var(--ink-soft); font-size: 12px; font-weight: 400; }

    /* 최선 — 지면을 한 톤 눌러 깔고 굵게 */
    .r.best { background: var(--paper-band); font-size: 17px; font-weight: 700; }
    .r.best .lbl { font-size: 15px; font-weight: 800; }

    .r.bad { background: var(--seal-bg); font-weight: 700; }
    .r.bad .lbl { font-weight: 800; }

    .r.dim { font-size: 13px; color: var(--ink-mid); }
    .r.dim .lbl { font-size: 12px; color: var(--ink-soft); }

    /* 라벨은 줄바꿈 없이 내용만큼 차지하고, 숫자가 나머지를 씁니다 */
    .r.kv { grid-template-columns: auto 1fr; }

    /* 인장 — 색을 못 보더라도 구분되도록 글자를 함께 찍습니다. */
    .seal {
      display: inline-block;
      margin-right: 8px;
      padding: 3px 8px;
      background: var(--seal);
      color: var(--paper-in);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
    }

    /* 아직 안 채운 칸 안내 — 오류가 아니므로 붉은색을 쓰지 않습니다 */
    .notice {
      padding: 16px 16px 14px;
      border: 2px solid var(--line);
      background: var(--paper-warm);
      font-family: var(--font-ui);
      color: var(--ink-mid);
    }
    .notice-head {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: .02em;
    }
    .notice ul { margin: 0; padding-left: 20px; }
    .notice li { font-size: 15px; color: var(--ink); line-height: 1.9; }
    .notice-tail {
      margin: 12px 0 0;
      padding-top: 11px;
      border-top: 1px solid var(--rule);
      font-size: 13px;
      line-height: 1.75;
      color: var(--ink-soft);
    }

    .error {
      padding: 14px 10px;
      border: 2px solid var(--seal);
      background: var(--seal-bg);
      color: var(--seal);
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
    }

    footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--rule);
      text-align: center;
      color: var(--ink-soft);
      font-size: 12px;
      line-height: 1.7;
    }

    /* 넓은 화면 — 마우스 환경이라 입력칸을 한 단 낮춥니다 */
    @media (min-width: 920px) {
      input[type="text"] { min-height: 36px; font-size: 17px; padding: 5px 10px; }
      .btn { min-height: 38px; padding: 6px 16px; }
      .cut, .del { min-height: 38px; }
      .h2-tools .btn { min-height: 30px; padding: 3px 12px; }
    }

    /* ============================================================
       좁은 화면
       ============================================================ */
    @media (max-width: 640px) {
      .r.kv { grid-template-columns: 1fr; }
      .r.kv .num { text-align: left; }
      .field { grid-template-columns: 1fr 130px 44px; }
      body { padding: 18px 10px 48px; }
      .cards { gap: 12px; }
      .panel { padding: 14px 12px 16px; }
      .r { padding: 10px 6px; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <a class="home" href="index.html">← 뒤로가기</a>
      <span class="eyebrow">플래닛 도우미</span>
    </div>

    <header>
      <h1>정산하기</h1>
      <p class="subtitle">사냥 아이템 판매금을 수수료까지 빼고 전원 똑같이 나눕니다</p>
    </header>

    <!-- ========================================================
         입력
         ======================================================== -->
    <div class="cards">

      <div class="card dist" style="--accent: var(--celadon);">
        <h2>분배</h2>
        <p class="fee">분배자 본인을 포함한 전체 인원입니다</p>
        <div class="field">
          <label for="people">분배 인원</label>
          <input type="text" id="people" inputmode="numeric">
          <span class="unit">명</span>
        </div>
        <div class="field">
          <label for="unit">정산금 절사 단위</label>
          <input type="text" id="unit" inputmode="numeric">
          <span class="unit">만메소</span>
        </div>
        <p class="note" id="perNote"></p>
      </div>

      <div class="card" style="--accent: var(--market);">
        <h2>수수료</h2>
        <p class="fee">택배는 분배자 · 직거래는 받는 이 부담</p>
        <div class="mini-grid">
          <div class="mini">
            <label for="aucFee">경매장 판매</label>
            <div class="mrow"><input type="text" id="aucFee" inputmode="decimal"><span class="unit">%</span></div>
          </div>
          <div class="mini">
            <label for="courFee">택배 수수료</label>
            <div class="mrow"><input type="text" id="courFee" inputmode="decimal"><span class="unit">%</span></div>
          </div>
          <div class="mini">
            <label for="courBase">택배비 (1건)</label>
            <div class="mrow"><input type="text" id="courBase" inputmode="numeric"><span class="unit">만메소</span></div>
          </div>
          <div class="mini">
            <label for="tradeFee">직거래 교환</label>
            <div class="mrow"><input type="text" id="tradeFee" inputmode="decimal"><span class="unit">%</span></div>
          </div>
        </div>
      </div>

      <div class="card" style="--accent: var(--gold);">
        <h2>판매 아이템
          <span class="h2-tools">
            <button class="btn primary" id="add">＋ 줄 추가</button>
            <button class="btn" id="clear">전체 삭제</button>
          </span>
        </h2>
        <p class="fee">판매가는 억 · 만 · 메소 칸에 나눠서 · 가위로 짤라서 판 템은 ✂</p>
        <div id="items"></div>
        <div class="field-3">
          <label for="scMan">가위값 (1개당)</label>
          <input type="text" id="scMan" inputmode="numeric" aria-label="가위값 만 단위">
          <span class="u">만</span>
          <input type="text" id="scMeso" inputmode="numeric" placeholder="메소" aria-label="가위값 메소 단위">
        </div>
        <p class="note" id="netNote"></p>
      </div>

    </div>

    <!-- ========================================================
         결과
         ======================================================== -->
    <div class="panel">
      <h2>결과
        <span class="h2-tools">
          <button class="btn" id="copy">결과 복사</button>
          <button class="btn" id="reset">입력 지우기</button>
        </span>
      </h2>
      <div id="out"></div>
    </div>

    <footer>
      입력값은 이 브라우저에 저장됩니다 · 넥슨코리아와 무관한 비공식 팬 페이지입니다
    </footer>
  </div>

  <script>
  (function () {
    'use strict';

    // v3: 판매가·가위값을 억/만/메소 세 칸으로 나눔
    const STORE_KEY = 'settle-calc-v3';
    const OLD_KEY   = 'settle-calc-v2';   // 만 단위 단일 칸이던 시절 — 읽어서 옮겨줍니다

    const MAN = 10000;   // 만 단위 입력 → 메소 환산 배수
    const EOK = 1e8;

    // 인원은 사냥마다 바뀌므로 비워 둡니다. 수수료·택배비는 게임 규칙이라 채워 둡니다.
    const DEFAULTS = {
      people:   '',
      unit:     '1',      // 1만메소
      aucFee:   '10',
      courFee:  '8',
      courBase: '1',      // 1만메소
      tradeFee: '6',
      scMan:    '',
      scMeso:   '',
      items:    []
    };

    /* ==========================================================
       숫자 도우미
       ========================================================== */
    const $ = function (id) { return document.getElementById(id); };

    function fmt(v, digits) {
      return v.toLocaleString('ko-KR', {
        minimumFractionDigits: digits || 0,
        maximumFractionDigits: digits || 0
      });
    }

    function loose(v) {
      return v.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    }

    // 짧게 — 억/만 단위로만 (분배 카드 요약 상자용)
    function mesoShort(v) {
      const a = Math.abs(v);
      if (a >= 1e8) return loose(v / 1e8) + '억';
      if (a >= 1e4) return fmt(Math.floor(v / 1e4)) + '만';
      return fmt(Math.round(v));
    }

    // 큰 메소는 억/만 단위를 괄호로 덧붙입니다.
    function meso(v) {
      const s = fmt(Math.round(v)) + '메소';
      const a = Math.abs(v);
      if (a >= 1e8) return s + ' (' + loose(v / 1e8) + '억)';
      if (a >= 1e4) return s + ' (' + loose(v / 1e4) + '만)';
      return s;
    }

    // 입력칸을 숫자로 읽습니다. 쉼표와 공백은 무시합니다.
    function num(el) {
      const raw = el.value.replace(/[,\s]/g, '');
      if (raw === '') return 0;
      const v = Number(raw);
      return isFinite(v) ? v : NaN;
    }

    const NUM_IDS = ['people', 'unit', 'aucFee', 'courFee', 'courBase', 'tradeFee',
                     'scMan', 'scMeso'];

    // 억/만/메소 세 값(숫자)을 메소로 합칩니다.
    function toMeso(eok, man, meso) {
      return Math.round(eok * EOK + man * MAN + meso);
    }

    // 메소 금액을 억/만/메소 세 칸 값으로 쪼갭니다 (옛 저장값 이관용).
    function splitMeso(total) {
      total = Math.max(0, Math.round(total));
      return {
        eok:  Math.floor(total / EOK) || '',
        man:  Math.floor(total % EOK / MAN) || '',
        meso: total % MAN || ''
      };
    }

    /* ==========================================================
       아이템 줄
       ========================================================== */
    let lastNetSum = 0;   // 카드 하단 요약 상자에 쓰는 실수령 합계

    function addRow(data) {
      const d = data || {};
      const row = document.createElement('div');
      row.className = 'irow';

      const name = document.createElement('input');
      name.type = 'text';
      name.className = 'name';
      name.dataset.key = 'name';
      name.placeholder = '아이템 이름';
      name.value = d.name !== undefined ? d.name : '';
      name.addEventListener('input', onAny);

      // 판매가 — 억/만/메소 세 칸
      function amtInput(key, ph) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.dataset.key = key;
        if (ph) inp.placeholder = ph;
        inp.inputMode = 'numeric';
        inp.value = d[key] !== undefined ? d[key] : '';
        inp.addEventListener('input', onAny);
        return inp;
      }
      function unitLabel(text) {
        const u = document.createElement('span');
        u.className = 'u';
        u.textContent = text;
        return u;
      }
      const pEok  = amtInput('pEok', '');
      const pMan  = amtInput('pMan', '');
      const pMeso = amtInput('pMeso', '메소');

      const cut = document.createElement('button');
      cut.className = 'cut' + (d.cut === '1' ? ' on' : '');
      cut.type = 'button';
      cut.title = '가위로 짤라서 판 아이템 — 가위값을 나눌 금액에서 뺍니다';
      cut.textContent = '✂';
      cut.setAttribute('aria-pressed', d.cut === '1' ? 'true' : 'false');
      cut.addEventListener('click', function () {
        cut.classList.toggle('on');
        cut.setAttribute('aria-pressed', cut.classList.contains('on') ? 'true' : 'false');
        onAny();
      });

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.title = '이 줄 삭제';
      del.textContent = '✕';
      del.addEventListener('click', function () { row.remove(); onAny(); });

      row.appendChild(name);
      row.appendChild(pEok);
      row.appendChild(unitLabel('억'));
      row.appendChild(pMan);
      row.appendChild(unitLabel('만'));
      row.appendChild(pMeso);
      row.appendChild(cut);
      row.appendChild(del);
      $('items').appendChild(row);
    }

    // 줄을 읽어 아이템 목록으로 바꿉니다. 아무것도 안 넣은 줄은 건너뜁니다.
    function readItems(aucFee) {
      const rows = Array.prototype.slice.call($('items').querySelectorAll('.irow'));
      const out = [];

      rows.forEach(function (row) {
        const o = {};
        row.querySelectorAll('input').forEach(function (inp) {
          o[inp.dataset.key] = inp.value;
        });

        // 판매가 = 억 + 만 + 메소 세 칸의 합
        const rd = function (key) { return Number((o[key] || '0').replace(/[,\s]/g, '')) || 0; };
        const price = toMeso(rd('pEok'), rd('pMan'), rd('pMeso'));
        if (price > 0) {
          const net = price - Math.floor(price * aucFee);
          out.push({
            name: (o.name || '').trim() || '(이름 없음)',
            price: price,
            net: net,
            cut: row.querySelector('.cut').classList.contains('on')
          });
        }
      });

      lastNetSum = out.reduce(function (s, it) { return s + it.net; }, 0);
      return out;
    }

    /* ==========================================================
       계산
       모두가 x 씩 받으려면:
         실수령 S = x + (N−1) × (x×(1+택배수수료) + 택배비)
         x = (S − 택배비×(N−1)) ÷ (1 + (1+택배수수료)×(N−1))
       x 는 절사 단위로 내리고, 남는 끝수는 분배자가 보관합니다.
       택배 수수료는 올림으로 잡아 분배자가 모자라는 일이 없게 합니다.
       ========================================================== */
    function compute() {
      const v = {};
      let bad = false;

      NUM_IDS.forEach(function (id) {
        const n = num($(id));
        if (isNaN(n)) { bad = true; $(id).classList.add('bad'); }
        else { $(id).classList.remove('bad'); }
        v[id] = n;
      });

      if (bad) return { error: '숫자가 아닌 값이 들어간 칸이 있습니다.' };

      const aucFee = Math.min(0.5, Math.max(0, v.aucFee / 100));
      const items = readItems(aucFee);

      // 아직 안 채운 칸은 잘못된 게 아닙니다 — 무엇이 남았는지만 알려 줍니다.
      const need = [];
      if (!(v.people >= 1)) need.push('분배 인원');
      if (!items.length) need.push('아이템 판매가');
      if (need.length) return { need: need };

      const r = {};
      r.N        = Math.max(1, Math.round(v.people));
      r.R        = r.N - 1;                                  // 나눠 받을 인원
      r.unit     = Math.max(1, Math.round(v.unit * MAN) || 1);   // 만 단위 입력
      r.courFee  = Math.min(0.5, Math.max(0, v.courFee / 100));
      r.tradeFee = Math.min(0.5, Math.max(0, v.tradeFee / 100));
      r.tradePct = v.tradeFee;
      r.courPct  = v.courFee;
      r.base     = Math.max(0, Math.round(v.courBase * MAN));    // 만 단위 입력
      r.items    = items;

      r.gross  = items.reduce(function (s, it) { return s + it.price; }, 0);
      r.netSum = items.reduce(function (s, it) { return s + it.net; }, 0);
      r.aucCut = r.gross - r.netSum;

      // 가위값 — ✂ 표시한 아이템 개수 × 1개당 가위값.
      // 분배자가 사서 올린 것이므로 나눌 금액에서 빼고 도로 가져갑니다.
      r.cutCount = items.filter(function (it) { return it.cut; }).length;
      r.scPrice  = Math.max(0, toMeso(0, v.scMan, v.scMeso));
      r.scissors = r.cutCount * r.scPrice;
      r.pot      = r.netSum - r.scissors;      // 실제로 나눌 금액

      if (r.cutCount > 0 && !(r.scPrice > 0)) return { need: ['가위값 (1개당)'] };
      if (r.pot <= 0) {
        return { error: '가위값이 실수령 합계보다 큽니다. 가위값이나 ✂ 표시를 확인해 주세요.' };
      }

      if (r.R === 0) return r;

      // ── 택배 — 분배자가 건당 수수료+택배비를 부담합니다.
      //   수수료 올림 때문에 총액을 넘길 수 있으니 안전하게 한 단위씩 내립니다.
      {
        const raw = (r.pot - r.base * r.R) / (1 + (1 + r.courFee) * r.R);
        let x = Math.floor(raw / r.unit) * r.unit;
        let fee = 0, perCost = 0, leftover = -1;
        while (x > 0) {
          fee = Math.ceil(x * r.courFee);
          perCost = x + fee + r.base;
          leftover = r.pot - x - perCost * r.R;
          if (leftover >= 0) break;
          x -= r.unit;
        }
        r.parcel = x > 0 ? { x: x, fee: fee, perCost: perCost, leftover: leftover } : null;
      }

      // ── 직거래 교환 — 받는 사람이 수수료를 냅니다.
      //   건네는 금액 y, 받는 사람 실수령 y−수수료. 분배자 보관분이
      //   받는 사람 실수령과 같아지도록 y = 나눌금액 ÷ (인원 − 수수료율) 입니다.
      {
        const raw = r.pot / (r.R + 1 - r.tradeFee);
        let y = Math.floor(raw / r.unit) * r.unit;
        let tfee = 0, net = 0, leftover = -1;
        while (y > 0) {
          tfee = Math.ceil(y * r.tradeFee);
          net = y - tfee;
          leftover = (r.pot - y * r.R) - net;
          if (leftover >= 0) break;
          y -= r.unit;
        }
        r.trade = y > 0 ? { y: y, tfee: tfee, net: net, leftover: leftover } : null;
      }

      if (!r.parcel && !r.trade) {
        return { error: '나눌 금액이 너무 적습니다. 인원을 줄이거나 절사 단위를 낮춰 보세요.' };
      }
      return r;
    }

    /* ==========================================================
       결과 그리기
       ========================================================== */
    function row(cls, parts) {
      const div = document.createElement('div');
      div.className = 'r ' + cls;
      parts.forEach(function (p) {
        const span = document.createElement('span');
        span.className = p.cls || 'num';
        span.innerHTML = p.html !== undefined ? p.html : String(p.text);
        div.appendChild(span);
      });
      return div;
    }

    // 결과 절은 一, 二, 三… 으로 번호를 매깁니다.
    const NUMERALS = ['一', '二', '三', '四', '五', '六', '七'];
    let sectionNo = 0;

    function section(title, sub) {
      const s = document.createElement('div');
      s.className = 'section';
      const h = document.createElement('h3');

      const no = document.createElement('span');
      no.className = 'no';
      no.textContent = NUMERALS[sectionNo] || String(sectionNo + 1);
      sectionNo++;
      h.appendChild(no);

      const ttl = document.createElement('span');
      ttl.textContent = title;
      h.appendChild(ttl);

      if (sub) {
        const em = document.createElement('span');
        em.className = 'sub';
        em.textContent = sub;
        h.appendChild(em);
      }
      s.appendChild(h);
      return s;
    }

    function render() {
      const out = $('out');
      out.innerHTML = '';
      sectionNo = 0;

      const r = compute();

      $('perNote').textContent = '';
      $('netNote').textContent = (!r.error && lastNetSum > 0)
        ? '실수령 합계 ' + fmt(lastNetSum) + '메소'
        : '';

      if (r.error) {
        const p = document.createElement('p');
        p.className = 'error';
        p.textContent = r.error;
        out.appendChild(p);
        return;
      }

      if (r.need) {
        const box = document.createElement('div');
        box.className = 'notice';
        const head = document.createElement('p');
        head.className = 'notice-head';
        head.textContent = '넣으면 바로 계산합니다';
        box.appendChild(head);

        const ul = document.createElement('ul');
        r.need.forEach(function (name) {
          const li = document.createElement('li');
          li.textContent = name;
          ul.appendChild(li);
        });
        box.appendChild(ul);

        const tail = document.createElement('p');
        tail.className = 'notice-tail';
        tail.textContent = '인원은 사냥마다 바뀌어서 미리 채워 두지 않았습니다. 한 번 넣으면 이 브라우저에 저장됩니다.';
        box.appendChild(tail);

        out.appendChild(box);
        return;
      }

      const potLbl = r.scissors > 0 ? '나눌 금액' : '실수령 합계';

      /* ---- 판매 정산 ---- */
      let s = section('판매 정산', r.items.length + '종 · 경매장 수수료를 뺀 실수령');
      s.appendChild(row('kv', [
        { cls: 'lbl', text: '총 판매금' },
        { text: meso(r.gross) }
      ]));
      s.appendChild(row('kv', [
        { cls: 'lbl', text: '경매장 수수료' },
        { text: '− ' + meso(r.aucCut) }
      ]));
      s.appendChild(row('kv' + (r.scissors > 0 ? '' : ' best'), [
        { cls: 'lbl', text: '실수령 합계' },
        { text: meso(r.netSum) }
      ]));
      if (r.scissors > 0) {
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '가위값 (' + r.cutCount + '개 · 분배자 회수)' },
          { text: '− ' + meso(r.scissors) }
        ]));
        s.appendChild(row('kv best', [
          { cls: 'lbl', text: '나눌 금액' },
          { text: meso(r.pot) }
        ]));
      }
      r.items.forEach(function (it) {
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: it.name + (it.cut ? ' ✂' : '') },
          { text: fmt(it.price) + '  →  실수령 ' + fmt(it.net) }
        ]));
      });
      out.appendChild(s);

      /* ---- 분배 — 방법별 1인당 ---- */
      s = section('분배', r.N + '명 전원이 똑같이 받습니다');

      if (r.R === 0) {
        $('perNote').textContent = '1인당 ' + mesoShort(r.pot);
        s.appendChild(row('kv best', [
          { cls: 'lbl', html: '<span class="seal">전원 동일</span>1인당' },
          { text: meso(r.pot) }
        ]));
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: '혼자 사냥' },
          { text: '전액 본인 몫입니다' }
        ]));
        out.appendChild(s);
        return;
      }

      const p = r.parcel, t = r.trade;
      const tradeWins = !!t && (!p || t.net > p.x);

      const noteParts = [];
      if (p) noteParts.push('택배 ' + mesoShort(p.x));
      if (t) noteParts.push('직거래 ' + mesoShort(t.net));
      $('perNote').textContent = '1인당 ' + noteParts.join(' · ');

      if (p) {
        s.appendChild(row('kv' + (!tradeWins ? ' best' : ''), [
          { cls: 'lbl', html: (!tradeWins ? '<span class="seal">유리</span>' : '') + '택배로 나누면' },
          { text: '1인당 ' + meso(p.x) }
        ]));
      }
      if (t) {
        s.appendChild(row('kv' + (tradeWins ? ' best' : ''), [
          { cls: 'lbl', html: (tradeWins ? '<span class="seal">유리</span>' : '') + '직거래로 나누면' },
          { text: '1인당 ' + meso(t.net) }
        ]));
      }
      if (p && t) {
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: '차이' },
          { text: '1인당 ' + fmt(Math.abs(t.net - p.x)) + '메소' }
        ]));
      }
      if (!p) {
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: '택배' },
          { text: '나눌 금액이 택배비를 감당하지 못해 뺐습니다' }
        ]));
      }
      out.appendChild(s);

      /* ---- 택배로 나눌 때 ---- */
      if (p) {
        s = section('택배로 나눌 때', '택배 ' + r.R + '건 · 수수료 ' + r.courPct + '%+택배비는 분배자 부담');
        s.appendChild(row('kv best', [
          { cls: 'lbl', text: '1건당 보낼 금액' },
          { text: meso(p.x) }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '1건당 택배 수수료' },
          { text: '+ ' + fmt(p.fee) + '메소' }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '1건당 택배비' },
          { text: '+ ' + fmt(r.base) + '메소' }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '1건당 지출 · ' + r.R + '건 총 지출' },
          { text: fmt(p.perCost) + '메소 · ' + meso(p.perCost * r.R) }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '분배자' },
          { text: fmt(p.x) + '메소' + (p.leftover > 0 ? ' + 끝수 ' + fmt(p.leftover) + '메소' : '') + ' 보관' }
        ]));
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: '검산 (몫+지출+끝수)' },
          { text: fmt(p.x + p.perCost * r.R + p.leftover) + ' = ' + potLbl + ' ✓' }
        ]));
        out.appendChild(s);
      }

      /* ---- 직거래로 나눌 때 ---- */
      if (t) {
        s = section('직거래로 나눌 때', '교환창 수수료 ' + r.tradePct + '%는 받는 사람 부담');
        s.appendChild(row('kv best', [
          { cls: 'lbl', text: '1인당 건넬 금액' },
          { text: meso(t.y) }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '받는 사람 수수료' },
          { text: '− ' + fmt(t.tfee) + '메소' }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '받는 사람 실수령' },
          { text: fmt(t.net) + '메소' }
        ]));
        s.appendChild(row('kv', [
          { cls: 'lbl', text: '분배자' },
          { text: fmt(t.net) + '메소' + (t.leftover > 0 ? ' + 끝수 ' + fmt(t.leftover) + '메소' : '') + ' 보관' }
        ]));
        s.appendChild(row('dim kv', [
          { cls: 'lbl', text: '검산 (건넴×' + r.R + '+보관)' },
          { text: fmt(t.y * r.R + t.net + t.leftover) + ' = ' + potLbl + ' ✓' }
        ]));
        out.appendChild(s);
      }
    }

    /* ==========================================================
       저장 · 복원
       ========================================================== */
    function onAny() {
      render();
      save();
    }

    function save() {
      try {
        const data = {};
        NUM_IDS.forEach(function (id) { data[id] = $(id).value; });
        data.items = Array.prototype.slice.call($('items').querySelectorAll('.irow')).map(function (row) {
          const o = {};
          row.querySelectorAll('input').forEach(function (inp) { o[inp.dataset.key] = inp.value; });
          o.cut = row.querySelector('.cut').classList.contains('on') ? '1' : '';
          return o;
        });
        localStorage.setItem(STORE_KEY, JSON.stringify(data));
      } catch (e) { /* 저장 못 해도 계산은 계속됩니다 */ }
    }

    function load() {
      let data = null;
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) data = JSON.parse(raw);
      } catch (e) { data = null; }

      // 만 단위 단일 칸이던 v2 저장값을 세 칸으로 옮겨줍니다.
      if (!data) {
        try {
          const old = JSON.parse(localStorage.getItem(OLD_KEY));
          if (old) {
            data = old;
            const scTotal = Math.round((Number(String(old.scPrice || '').replace(/[,\s]/g, '')) || 0) * MAN);
            data.scMan = String(Math.floor(scTotal / MAN) || '');
            data.scMeso = String(scTotal % MAN || '');
            if (Array.isArray(old.items)) {
              data.items = old.items.map(function (o) {
                const p = splitMeso((Number(String(o.price || '').replace(/[,\s]/g, '')) || 0) * MAN);
                return { name: o.name, pEok: String(p.eok), pMan: String(p.man), pMeso: String(p.meso), cut: o.cut };
              });
            }
          }
        } catch (e) { data = null; }
      }

      applyDefaults();

      if (data) {
        NUM_IDS.forEach(function (id) {
          if (typeof data[id] === 'string' && data[id] !== '') $(id).value = data[id];
        });
        if (Array.isArray(data.items)) {
          $('items').innerHTML = '';
          data.items.forEach(addRow);
        }
      }
      if (!$('items').querySelector('.irow')) addRow();
    }

    function applyDefaults() {
      NUM_IDS.forEach(function (id) { $(id).value = DEFAULTS[id]; });
    }

    /* ==========================================================
       결과 복사
       ========================================================== */
    function copyText() {
      const lines = [];
      $('out').querySelectorAll('.section').forEach(function (sec) {
        lines.push('■ ' + sec.querySelector('h3').textContent);
        sec.querySelectorAll('.r').forEach(function (rw) {
          const cells = Array.prototype.map.call(rw.children, function (c) {
            return c.textContent.trim();
          }).filter(function (t) { return t !== ''; });
          lines.push('  ' + cells.join('   '));
        });
        lines.push('');
      });
      const text = lines.join('\n');

      const done = function () {
        const btn = $('copy');
        const old = btn.textContent;
        btn.textContent = '복사했습니다';
        setTimeout(function () { btn.textContent = old; }, 1400);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () {});
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {}
        ta.remove();
      }
    }

    /* ==========================================================
       초기화
       ========================================================== */
    NUM_IDS.forEach(function (id) {
      $(id).addEventListener('input', onAny);
    });

    $('add').addEventListener('click', function () { addRow(); onAny(); });
    $('clear').addEventListener('click', function () {
      $('items').innerHTML = '';
      addRow();
      onAny();
    });
    $('copy').addEventListener('click', copyText);
    $('reset').addEventListener('click', function () {
      applyDefaults();
      $('items').innerHTML = '';
      addRow();
      onAny();
    });

    load();
    render();
  })();
  </script>

</body>
</html>
