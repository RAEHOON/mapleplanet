<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메이플 도구모음</title>
  <meta name="description" content="메소 환율 계산기와 유혹 타이머. 브라우저에서 바로 쓰는 비공식 팬 도구입니다.">
  <meta property="og:title" content="메이플 도구모음">
  <meta property="og:description" content="메소 환율 계산기와 유혹 타이머를 한 곳에서.">
  <meta name="theme-color" content="#150e26">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       디자인 토큰 — 타이머 페이지와 같은 값을 씁니다.
       ============================================================ */
    :root {
      --bg-deep:      #100a1c;
      --bg-mid:       #170f2b;
      --panel:        #1d1533;
      --panel-top:    #251b40;
      --line:         #3a2d5c;
      --line-soft:    #2c2246;

      --ink:          #ece6ff;
      --ink-dim:      #a498c8;
      --ink-faint:    #6f6390;

      --gold:         #ffc93c;
      --gold-deep:    #e8a013;
      --violet:       #c58cff;

      --radius-lg:    18px;
      --radius-md:    12px;

      --shadow-panel: 0 6px 0 rgba(0,0,0,.35), 0 14px 30px rgba(0,0,0,.45);

      --font-display: 'Black Han Sans', 'Malgun Gothic', sans-serif;
      --font-ui:      'Jua', 'Malgun Gothic', sans-serif;
      --font-num:     'Do Hyeon', 'Malgun Gothic', monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 48px 16px 64px;
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a1c4d 0%, rgba(42,28,77,0) 60%),
        radial-gradient(900px 500px at 100% 100%, #241640 0%, rgba(36,22,64,0) 55%),
        linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;

      display: flex;
      flex-direction: column;
      min-height: 100%;
    }

    /* ============================================================
       헤더
       ============================================================ */
    header { text-align: center; margin-bottom: 40px; }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      letter-spacing: .02em;
      margin: 0;
      background: linear-gradient(180deg, #fff3c4 0%, var(--gold) 45%, var(--gold-deep) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)) drop-shadow(0 0 18px rgba(255,201,60,.35));
    }

    .subtitle {
      color: var(--ink-dim);
      font-size: 1rem;
      margin: 10px 0 0;
    }

    /* ============================================================
       메뉴 타일 — 각 도구로 들어가는 큰 버튼
       ============================================================ */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      align-content: start;
    }

    .tile {
      /* --accent 는 타일마다 다르게 지정합니다. */
      --accent: var(--gold);

      display: block;
      text-decoration: none;
      color: inherit;

      background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel) 100%);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-panel);
      padding: 28px 24px 26px;
      text-align: center;

      transition: transform .12s, box-shadow .12s, border-color .18s;
    }

    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow:
        0 10px 0 rgba(0,0,0,.35),
        0 18px 36px rgba(0,0,0,.5),
        0 0 26px -6px var(--accent);
      outline: none;
    }

    .tile:active { transform: translateY(0); }

    .tile .icon {
      font-size: 2.6rem;
      line-height: 1;
      display: block;
      margin-bottom: 14px;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.5));
    }

    .tile .name {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--accent);
      display: block;
      letter-spacing: .01em;
    }

    .tile .desc {
      color: var(--ink-dim);
      font-size: .92rem;
      margin: 10px 0 0;
      line-height: 1.6;
    }

    /* ============================================================
       푸터
       ============================================================ */
    footer {
      text-align: center;
      color: var(--ink-faint);
      font-size: .8rem;
      margin-top: 56px;
      line-height: 1.7;
    }

    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      .tile:hover, .tile:focus-visible { transform: none; }
    }
  </style>
</head>
<body>

  <header>
    <h1>메이플 도구모음</h1>
    <p class="subtitle">설치 없이 브라우저에서 바로 쓰는 도구들</p>
  </header>

  <main>
    <a class="tile" href="calculator.html" style="--accent: var(--gold);">
      <span class="icon">💰</span>
      <span class="name">메소 환율 계산기</span>
      <p class="desc">택배 · 자유시장 · 경매장 시세를 비교해<br>메소를 가장 싸게 구하는 방법을 찾습니다</p>
    </a>

    <a class="tile" href="timer.html" style="--accent: var(--violet);">
      <span class="icon">⏱️</span>
      <span class="name">유혹 타이머</span>
      <p class="desc">최대 5개, 60분까지 무한 반복되는 타이머<br>임박하면 점멸 · 알림음으로 알려줍니다</p>
    </a>
  </main>

  <footer>
    이 페이지는 넥슨코리아와 무관한 비공식 팬 페이지입니다.
  </footer>

</body>
</html>
