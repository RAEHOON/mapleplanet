<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메이플스토리 흑야 길드</title>
  <!-- 카카오톡, 디스코드 등 링크 미리보기 설정 -->
<meta property="og:title" content="미리보기금지">
<meta property="og:description" content="길드 홈페이지 개설예정">
<meta property="og:image" content="zakum.jpg">
  <style>
    /* 기본 배경 및 폰트 설정 (다크 테마) */
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      text-align: center;
      margin: 0;
      padding: 50px 20px;
    }

    /* 메인 제목 스타일 */
    h1 {
      color: #f1c40f;
      font-size: 3em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
    }

    p.subtitle {
      color: #aaa;
      font-size: 1.2em;
      margin-bottom: 50px;
    }

    /* 보스 카드들을 가로로 나열하는 그리드 설정 */
    .boss-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* 개별 보스 카드 디자인 */
    .boss-card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 20px;
      width: 250px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 카드에 마우스를 올렸을 때 살짝 떠오르는 효과 */
    .boss-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.7);
      border-color: #f1c40f;
    }

    /* 이미지 영역 설정 */
    .boss-image {
      width: 100%;
      height: 200px;
      background-color: #333;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      overflow: hidden;
    }

    /* 이미지가 꽉 차고 예쁘게 잘리도록 설정 */
    .boss-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .boss-card h2 {
      margin: 10px 0;
      color: #fff;
    }

    .boss-card p {
      color: #888;
      font-size: 0.95em;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  
  <div class="boss-container">
    
    <!-- 자쿰 카드 -->
    <div class="boss-card">
      <div class="boss-image">
        <img src="jakum.jpg" alt="자쿰">
      </div>
      <h2>자쿰</h2>
      <p>폐광의 가장 깊은 곳, 인내의 숲을 넘어선 자만이 도전할 수 있는 여덟 개의 팔.</p>
    </div>

    <!-- 혼테일 카드 -->
    <div class="boss-card">
      <div class="boss-image">
        <img src="hon.png" alt="혼테일">
      </div>
      <h2>혼테일</h2>
      <p>생명의 동굴을 지배하는 거대한 세 개의 머리. 진정한 용사들의 시험 무대.</p>
    </div>

    <!-- 핑크빈 카드 -->
    <div class="boss-card">
      <div class="boss-image">
        <img src="pinkbin.jpg" alt="핑크빈">
      </div>
      <h2>핑크빈</h2>
      <p>시간의 신전 너머에서 온 귀여운 파괴자. 겉모습에 속지 마세요!</p>
    </div>

  </div>

</body>
</html>
