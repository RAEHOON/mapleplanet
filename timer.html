<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유혹 타이머</title>
  <meta name="description" content="최대 8개, 60분까지 무한 반복되는 타이머. 임박 경고와 알림음 지원.">
  <meta property="og:title" content="유혹 타이머">
  <meta property="og:description" content="최대 8개, 60분 무한 반복 타이머. 임박하면 점멸·알림음으로 확실하게 알려줍니다.">
  <meta name="theme-color" content="#1c1813">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* ============================================================
       디자인 토큰 — 색/간격/모양을 여기 한 곳에서만 관리합니다.
       ============================================================ */
    :root {
      /* 가죽장정 — 계산기와 같은 디자인 언어에 바탕만 뒤집었습니다.
         타이머는 게임을 하면서 곁눈으로 보는 화면이라 어두운 바탕에
         밝은 글씨가 훨씬 잘 읽힙니다. */
      --bg-deep:      #14110d;
      --bg-mid:       #1c1813;
      --panel:        #262019;
      --panel-top:    #2f2820;
      --line:         #6a5c46;   /* 테두리 */
      --line-soft:    #443a2c;   /* 가는 괘선 */

      --ink:          #f6edd8;
      --ink-dim:      #c3b492;
      --ink-faint:    #8d7c5e;

      --paper-in:     #100d09;   /* 입력칸·자릿수 타일 안쪽 */

      --gold:         #dcbb4c;   /* 강조 = 금박 */
      --gold-deep:    #c9a227;
      --warn:         #f0a63c;   /* 1단계 경고 */
      --danger:       #e2543a;   /* 2단계 경고 */
      --ok:           #6fae72;

      /* 각지게 — 라운드 없음 */
      --radius-lg:    0;
      --radius-md:    0;
      --radius-sm:    0;

      /* 번짐 없는 각진 그림자 */
      --shadow-panel: 5px 5px 0 rgba(0,0,0,.45);
      --shadow-key:   3px 3px 0 rgba(0,0,0,.5);

      --font-display: 'Gulim', '굴림', 'Malgun Gothic', sans-serif;
      --font-ui:      'Gulim', '굴림', 'Malgun Gothic', sans-serif;
      --font-num:     'Gulim', '굴림', 'Malgun Gothic', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      padding: 28px 16px 64px;
      font-family: var(--font-ui);
      color: var(--ink);
      background: var(--bg-mid);
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       헤더
       ============================================================ */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto 20px;
    }

    .eyebrow { font-size: 13px; color: var(--ink-dim); letter-spacing: .18em; }

    header {
      text-align: center;
      max-width: 1180px;
      margin: 0 auto 22px;
      border-top: 4px solid var(--gold);
      border-bottom: 4px solid var(--gold);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 5.5vw, 2.7rem);
      font-weight: 800;
      letter-spacing: .12em;
      margin: 0;
      padding: 22px 8px 8px;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      text-wrap: balance;
    }

    .subtitle {
      color: var(--ink-dim);
      font-size: .95rem;
      margin: 0;
      padding: 9px 8px 18px;
    }

    /* ============================================================
       상단 툴바 — 전체 제어
       ============================================================ */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 1180px;
      margin: 18px auto 26px;
    }

    /* 게임 UI 느낌의 입체 버튼 (공통) */
    .btn {
      font-family: var(--font-ui);
      font-size: .95rem;
      color: var(--ink);
      background: linear-gradient(180deg, var(--panel-top), var(--panel));
      border: 2px solid var(--line);
      border-radius: var(--radius-md);
      padding: 9px 15px;
      cursor: pointer;
      box-shadow: var(--shadow-key);
      transition: transform .08s, box-shadow .08s, border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover  { border-color: var(--gold); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
    .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .btn.on {
      border-color: var(--gold);
      background: var(--gold);
      color: var(--paper-in);
    }

    /* ============================================================
       타이머 그리드
       ============================================================ */
    .grid {
      display: grid;
      /* 최소 폭 = [지우기][다시시작][분초] 한 줄이 들어가는 크기.
         이보다 좁히면 시간 줄이 카드 밖으로 삐져나옵니다. */
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .card {
      /* --base 는 사용자가 고른 고유 색(JS가 인라인으로 지정).
         --accent 는 경고 단계에 따라 덮어써지는 실제 표시색입니다. */
      --base: var(--gold);
      --accent: var(--base);
      position: relative;
      background: linear-gradient(180deg, var(--panel-top) 0%, var(--panel) 100%);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px 14px 16px;
      box-shadow: var(--shadow-panel);
      transition: border-color .25s, box-shadow .25s;
    }

    /* 광택은 지면이 밝아진 뒤로 보이지도 어울리지도 않아 뺐습니다. */
    .card::before { display: none; }

    .card.running { border-color: var(--accent); }

    /* ---------- 카드 헤더: 색 선택 + 이름 ---------- */
    .card-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .name {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-ui);
      font-size: 1.05rem;
      color: var(--ink);
      background: transparent;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 4px 7px;
      transition: background .15s, border-color .15s;
    }
    .name:hover  { background: rgba(255,255,255,.07); }
    .name:focus  { outline: none; background: var(--paper-in); border-color: var(--base); }

    .laps {
      flex: 0 0 auto;
      font-size: .8rem;
      color: var(--ink-faint);
      font-family: var(--font-num);
      min-width: 34px;
      text-align: right;
    }
    .laps.has { color: var(--accent); }

    /* ---------- 시간 표시: 다시 시작 버튼 + 자릿수 타일 ---------- */
    .time-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 11px;
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .digits {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
      position: relative;
      z-index: 1;
    }

    .d {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 56px;
      font-family: var(--font-num);
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      padding: 0;
      /* 숫자 자체는 가장 밝게. 상태는 아래에서 덮어씁니다. */
      color: var(--ink);
      background: var(--paper-in);
      border: 2px solid var(--line);
      border-radius: var(--radius-sm);
      transition: color .2s, border-color .2s, background .2s;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
    }
    .d:focus {
      outline: none;
      border-color: var(--gold);
      background: #1a1510;
    }
    .d::selection { background: var(--gold); color: var(--paper-in); }

    .colon {
      font-family: var(--font-num);
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--ink-dim);
      padding-bottom: 6px;
    }

    /* 대기 상태는 한 톤 낮추되, 읽는 데 지장 없을 만큼만 낮춥니다 */
    .card.idle .d { color: #a1927a; }

    /* 일시정지는 '대기'와 구분되도록 금박으로 남깁니다 */
    .card.paused .d { color: var(--gold); }

    /* 임박하면 숫자 색이 곧 경고입니다 */
    .card.warn .d   { color: var(--warn); }
    .card.danger .d { color: var(--danger); }

    /* ---------- EXP 바 스타일 진행바 ---------- */
    .bar {
      position: relative;
      height: 15px;
      background: #100d09;
      border: 2px solid var(--line);
      border-radius: 0;
      overflow: hidden;
      margin-bottom: 13px;
      z-index: 1;
    }

    .bar-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: var(--accent);
      border-radius: 0;
      transition: width .2s linear, background-color .3s;
    }
    .bar-fill::after { display: none; }

    /* ---------- 빠른 시간 선택 칩 ---------- */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 11px;
      position: relative;
      z-index: 1;
    }

    .chip {
      /* 7개가 카드 폭에 맞춰 두 줄로 고르게 나뉘도록 basis 를 줍니다 */
      flex: 1 1 44px;
      font-family: var(--font-ui);
      font-size: .82rem;
      color: var(--ink-dim);
      background: var(--paper-in);
      border: 2px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 6px 4px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover { color: var(--ink); border-color: var(--base); }
    .chip.sel   { color: var(--paper-in); background: var(--base); border-color: var(--base); font-weight: bold; }
    .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* ---------- 미세 조절 (±1 · ±3 · ±5초) ---------- */
    .steps {
      display: flex;
      gap: 4px;
      margin-bottom: 11px;
      position: relative;
      z-index: 1;
    }

    .steps-grp { display: flex; gap: 4px; flex: 1 1 0; }

    .step {
      flex: 1 1 0;
      min-width: 0;
      font-family: var(--font-num);
      font-size: .88rem;
      color: var(--ink-dim);
      background: var(--paper-in);
      border: 2px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 5px 2px;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s, transform .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .step:active { transform: translateY(2px); }
    .step.minus:hover { color: var(--warn); border-color: var(--warn); }
    .step.plus:hover  { color: var(--ok);   border-color: var(--ok); }
    .step:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* 최소/최대에 닿으면 더 못 누른다는 걸 보여줍니다 */
    .step:disabled { opacity: .3; cursor: default; }
    .step:disabled:hover { color: var(--ink-dim); border-color: var(--line-soft); }

    /* ---------- 직접 입력 ---------- */
    .manual {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .manual input {
      width: 58px;
      font-family: var(--font-num);
      font-size: 1.1rem;
      text-align: center;
      color: var(--ink);
      background: var(--paper-in);
      border: 2px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 4px;
      transition: border-color .15s;
    }
    .manual input:focus { outline: none; border-color: var(--base); }
    .manual label { font-size: .85rem; color: var(--ink-faint); }

    /* ---------- 컨트롤 ---------- */
    .controls {
      display: flex;
      gap: 7px;
      position: relative;
      z-index: 1;
    }

    .btn-main {
      flex: 1 1 auto;
      width: 100%;
      /* 아이콘과 글자를 나눠 담습니다 — 압축 PIP에서 글자만 감추기 위해서입니다 */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-ui);
      font-size: 1.02rem;
      color: var(--paper-in);
      background: var(--accent);
      border: 2px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px;
      cursor: pointer;
      box-shadow: var(--shadow-key);
      transition: transform .08s, box-shadow .08s, filter .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-main:hover  { filter: brightness(1.08); }
    .btn-main:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
    .btn-main:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* 지우기 — 되돌릴 수 없는 조작이라 한 톤 낮춰 둡니다 */
    .btn-clear {
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      padding: 0;
      font-family: var(--font-num);
      font-size: 1.05rem;
      color: var(--ink-faint);
      background: transparent;
      border: 2px solid var(--line-soft);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: color .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-clear:hover { color: var(--danger); border-color: var(--danger); }
    .btn-clear:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .btn-reset {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      font-size: 1.25rem;
      color: var(--ink-dim);
      background: linear-gradient(180deg, var(--panel-top), var(--panel));
      border: 2px solid var(--line);
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: var(--shadow-key);
      transition: transform .08s, box-shadow .08s, color .15s, border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-reset:hover  { color: var(--ink); border-color: var(--warn); }
    .btn-reset:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
    .btn-reset:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    /* ============================================================
       임박 경고 — 3단계로 강해집니다
       ============================================================ */

    /* 1단계 · 30초 이하: 색이 주황으로 바뀝니다 */
    .card.warn { --accent: var(--warn); }

    /* 2단계 · 10초 이하: 빨강 + 숫자 점멸 + 카드 테두리 맥동 */
    .card.danger { --accent: var(--danger); }

    .card.danger .d {
      animation: digit-blink .5s steps(1, end) infinite;
    }
    @keyframes digit-blink {
      0%,  49% { color: var(--danger);  background: var(--paper-in); border-color: var(--danger); }
      50%,100% { color: #1c1813;        background: var(--danger);  border-color: var(--danger); }
    }

    .card.danger {
      animation: card-alarm .5s ease-in-out infinite;
    }
    @keyframes card-alarm {
      0%,100% { border-color: var(--danger); box-shadow: var(--shadow-panel), 0 0 0 2px rgba(226,84,58,.30); }
      50%     { border-color: var(--danger); box-shadow: var(--shadow-panel), 0 0 0 7px rgba(226,84,58,.40); }
    }

    /* 3단계 · 5초 이하: 카드가 흔들립니다 */
    .card.critical .digits { animation: shake .38s ease-in-out infinite; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-4px); }
      75%     { transform: translateX(4px); }
    }

    /* 완료 순간 · 카드가 한 번 크게 튑니다 */
    .card.done { animation: done-pop .6s ease-out; }
    @keyframes done-pop {
      0%   { transform: scale(1);    box-shadow: var(--shadow-panel), 0 0 0 0 rgba(220,187,76,.55); }
      25%  { transform: scale(1.05); box-shadow: var(--shadow-panel), 0 0 0 10px rgba(220,187,76,.55); }
      100% { transform: scale(1);    box-shadow: var(--shadow-panel), 0 0 0 0 rgba(220,187,76,0); }
    }

    /* 완료 순간 · 화면 전체 플래시 */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      opacity: 0;
      background: var(--ink);
    }
    #flash.on { animation: flash .6s ease-out; }
    @keyframes flash {
      0%   { opacity: 0; }
      12%  { opacity: .6; }
      100% { opacity: 0; }
    }

    /* ============================================================
       완료 알림 토스트
       ============================================================ */
    #toasts {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 950;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: min(92vw, 420px);
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      font-size: 1rem;
      color: var(--paper-in);
      background: var(--accent, var(--gold));
      border: 2px solid var(--line);
      border-radius: var(--radius-md);
      padding: 11px 15px;
      box-shadow: var(--shadow-key);
      animation: toast-in .3s ease-out, toast-out .4s ease-in 3.4s forwards;
    }
    .toast b { font-family: var(--font-display); }
    @keyframes toast-in  { from { opacity: 0; transform: translateY(-18px); } }
    @keyframes toast-out { to   { opacity: 0; transform: translateY(-18px); } }

    /* ============================================================
       PIP 창 — 실제 DOM을 통째로 옮겨오므로 창 안에서도 조작이 그대로
       됩니다. 배치는 하나뿐입니다: 타이머 한 개가 딱 한 줄.
       [색] [이름] [남은시간] [−5 −3 −1] [재생] [+1 +3 +5] [리셋]
       ============================================================ */
    body.pip-mode { padding: 6px; }

    body.pip-mode .toolbar {
      margin: 0 0 6px;
      gap: 4px;
      justify-content: flex-start;
      max-width: none;
    }
    body.pip-mode .btn {
      padding: 4px 8px;
      font-size: .76rem;
      border-width: 1px;
      border-radius: 0;
      box-shadow: none;
    }

    body.pip-mode .grid { grid-template-columns: 1fr; gap: 4px; max-width: none; }

    body.pip-mode .card {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px 9px;
      border-width: 1px;
      box-shadow: none;
    }

    /* 묶음 상자를 걷어내 버튼들이 카드의 직계 자식으로 한 줄에 섭니다. */
    body.pip-mode .steps,
    body.pip-mode .controls { display: contents; }

    body.pip-mode .card-head       { order: 1; flex: 1 1 0; min-width: 0; margin: 0; gap: 4px; }
    body.pip-mode .time-row        { order: 2; flex: 0 0 auto; margin: 0; gap: 5px; }
    body.pip-mode .steps-grp.minus { order: 3; }
    body.pip-mode .btn-main        { order: 4; }
    body.pip-mode .steps-grp.plus  { order: 5; }

    body.pip-mode .steps-grp { display: flex; gap: 2px; flex: 0 0 auto; }

    /* 진행바는 행 아래쪽에 얇게 깔립니다 — 줄이 두 줄로 늘어나지 않도록. */
    body.pip-mode .bar {
      position: absolute;
      left: 1px; right: 1px; bottom: 1px;
      height: 3px;
      margin: 0;
      border: none;
      background: #100d09;
    }

    /* 프리셋 칩과 직접 입력은 한 줄에 들어갈 자리가 없어 뺍니다. */
    body.pip-mode .chips,
    body.pip-mode .manual { display: none; }

    /* 이름칸은 글자 수에 맞춰 늘고 줄어듭니다. 남는 폭은 뒤(--name-w 다음)로
       몰아서, 줄마다 남은시간과 버튼이 같은 자리에 서게 합니다. */
    body.pip-mode .name {
      font-size: .8rem;
      padding: 1px 3px;
      border-width: 1px;
      flex: 0 1 auto;
      width: var(--name-w, auto);
      min-width: 3em;
      max-width: 12em;
      field-sizing: content;
    }
    body.pip-mode .laps   { font-size: .65rem; min-width: 0; }

    /* 남은 시간이 이 창의 주인공입니다 — 정사각 타일로 키웁니다. */
    body.pip-mode .digits { gap: 2px; }
    body.pip-mode .d {
      width: 34px;
      height: 34px;
      font-size: 1.7rem;
      border-width: 2px;
    }
    body.pip-mode .colon { font-size: 1.35rem; padding: 0 2px; }

    body.pip-mode .step {
      flex: 0 0 auto;
      width: 25px;
      padding: 4px 0;
      font-size: .74rem;
      border-width: 1px;
    }

    body.pip-mode .btn-main {
      flex: 0 0 auto;
      width: 34px;
      gap: 0;
      padding: 6px 0;
      font-size: .95rem;
      border-width: 1px;
      box-shadow: none;
    }
    body.pip-mode .btn-main .lbl { display: none; }

    body.pip-mode .btn-reset {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      font-size: 1rem;
      border-width: 1px;
      box-shadow: none;
    }

    body.pip-mode .btn-clear {
      width: 24px;
      height: 24px;
      font-size: .85rem;
      border-width: 1px;
    }

    /* 흔들림은 옆 칸을 밀어내므로 한 줄 배치에서는 끕니다. */
    body.pip-mode .card.critical .digits { animation: none; }

    /* ---------- PIP에 담지 않은 타이머 ----------
       아주 감춰 버리면 PIP 안에서 되돌릴 방법이 없어, 이름줄만 남깁니다. */
    body.pip-mode .card.pip-off { padding: 3px 7px; opacity: .72; }
    body.pip-mode .card.pip-off .time-row,
    body.pip-mode .card.pip-off .steps-grp,
    body.pip-mode .card.pip-off .btn-main,
    body.pip-mode .card.pip-off .bar { display: none; }
    body.pip-mode .card.pip-off .name { font-size: .72rem; }

    /* ---------- PIP 담기 토글 ---------- */
    .pip-pick {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      color: var(--ink-faint);
      background: transparent;
      border: 2px solid var(--line-soft);
      border-radius: 0;
      cursor: pointer;
      transition: color .15s, border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pip-pick:hover { color: var(--ink); border-color: var(--line); }
    .pip-pick:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .pip-pick[aria-pressed="true"] {
      color: var(--paper-in);
      background: var(--gold);
      border-color: var(--gold);
    }
    body.pip-mode .pip-pick { width: 22px; height: 22px; border-width: 1px; margin-right: auto; }

    /* 캔버스 방식 PIP (Document PIP 미지원 브라우저 대비용) */
    #pip-canvas, #pip-video { position: fixed; left: -9999px; top: -9999px; }

    footer {
      text-align: center;
      color: var(--ink-faint);
      font-size: .8rem;
      margin-top: 44px;
      line-height: 1.7;
    }

    /* ============================================================
       모바일
       ============================================================ */
    @media (max-width: 520px) {
      body { padding: 20px 12px 48px; }
      .grid { gap: 14px; }
      .d { width: 42px; height: 56px; font-size: 2.2rem; }
    }

    /* 도구모음으로 돌아가는 링크 */
    .home {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--ink-dim);
      text-decoration: none;
      font-size: .92rem;
      padding: 6px 14px;
      border: 2px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--panel);
    }
    .home:hover { color: var(--ink); border-color: var(--gold); }

    /* ============================================================
       좁은 화면 — 손가락으로 누르는 크기(44px)를 확보합니다
       ============================================================ */
    @media (max-width: 560px) {
      body { padding: 16px 10px 48px; }

      .toolbar { gap: 6px; margin: 14px auto 20px; }
      .btn { padding: 11px 14px; }

      .grid { grid-template-columns: 1fr; gap: 14px; }

      .name { min-height: 44px; font-size: 1rem; }
      .pip-pick { width: 40px; height: 40px; }

      /* 프리셋 칩은 네 칸 격자로 — 마지막 줄 하나가 통째로 늘어나지 않게 */
      .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .chip { min-height: 44px; padding: 6px 2px; }

      .steps { gap: 6px; }
      .step { min-height: 44px; }

      .manual input { min-height: 44px; font-size: 1.15rem; }

      .btn-clear { width: 44px; height: 44px; font-size: 1.15rem; }
      .btn-reset { width: 52px; height: 52px; }
      .btn-main { padding: 13px; }

      .time-row { gap: 8px; }
      .d { width: 42px; height: 56px; font-size: 2.2rem; }
      .colon { font-size: 1.8rem; }
    }

    /* 아주 좁은 화면(360 이하)에서는 자릿수를 한 단계 더 줄입니다 */
    @media (max-width: 380px) {
      .d { width: 37px; height: 50px; font-size: 1.95rem; }
      .btn-reset { width: 46px; height: 46px; }
      .time-row { gap: 6px; }
    }

    /* 애니메이션을 줄이도록 설정한 사용자 배려 */
    @media (prefers-reduced-motion: reduce) {
      .card.danger,
      .card.danger .d,
      .card.critical .digits,
      .card.done,
      #flash.on { animation: none !important; }
      .card.danger .d { color: #1c1813; background: var(--danger); border-color: var(--danger); }
    }
  </style>

<body>

  <div id="flash"></div>
  <div id="toasts"></div>

  <div class="topbar">
    <a class="home" href="index.html">← 뒤로가기</a>
    <span class="eyebrow">플래닛 도우미</span>
  </div>

  <header>
    <h1>유혹 타이머</h1>
    <p class="subtitle">시간이 끝나면 자동으로 다시 돌아 무한 반복됩니다 (최대 60분)</p>
  </header>

  <div class="toolbar">
    <button class="btn" id="start-all">▶ 전체 시작</button>
    <button class="btn" id="stop-all">⏸ 전체 정지</button>
    <button class="btn" id="reset-all">↺ 전체 다시 시작</button>
    <button class="btn" id="clear-all">0 전체 지우기</button>
    <button class="btn on" id="sound-btn" aria-pressed="true">🔊 소리 켜짐</button>
    <button class="btn" id="notify-btn">🔔 알림 켜기</button>
    <button class="btn" id="pip-btn">📺 PIP (항상 위)</button>
  </div>

  <main class="grid" id="grid"></main>

  <canvas id="pip-canvas" width="330" height="400"></canvas>
  <video id="pip-video" muted autoplay playsinline></video>

  <footer>
    설정한 시간은 이 브라우저에 저장되어 새로고침해도 유지됩니다.<br>
    이 페이지는 넥슨코리아와 무관한 비공식 팬 페이지입니다.
  </footer>

  <script>
  (function () {
    'use strict';

    /* ==========================================================
       설정
       ========================================================== */
    const MAX_TIMERS = 8;
    const MAX_SECONDS = 3600;          // 60분
    const WARN_AT = 30;                // 주의 시작 (초)
    const DANGER_AT = 10;              // 경고 시작 (초)
    const CRITICAL_AT = 5;             // 최고 경고 시작 (초)
    const STORE_KEY = 'yuhok-timers-v2';

    // 타이머별 색을 없앴습니다. 색이 '어느 타이머인가'를 뜻하면
    // 정작 중요한 '얼마나 급한가'가 묻힙니다. 이제 색은 상태만 뜻합니다:
    // 평소 금박 → 30초 주황 → 10초 붉은색.
    const ACCENT = '#dcbb4c';

    // 빠른 선택 칩 (라벨, 초)
    const PRESETS = [
      { label: '30초', sec: 30 },
      { label: '40초', sec: 40 },
      { label: '50초', sec: 50 },
      { label: '1분',  sec: 60 },
      { label: '2분',  sec: 120 },
      { label: '3분',  sec: 180 },
      { label: '5분',  sec: 300 }
    ];

    // 미세 조절 버튼 (초). 음수가 왼쪽, 양수가 오른쪽으로 놓입니다.
    const STEPS = [-5, -3, -1, 1, 3, 5];

    /* ==========================================================
       상태
       ========================================================== */
    // total    : 설정된 총 시간(초)
    // endsAt   : 작동 중일 때 종료 시각(ms). 정지 중이면 null
    // paused   : 일시정지 시점의 남은 초. 작동/대기 중이면 null
    // laps     : 반복 횟수
    const timers = [];
    for (let i = 0; i < MAX_TIMERS; i++) {
      timers.push({
        id: i + 1,
        name: '타이머 ' + (i + 1),
        color: ACCENT,          // 완료 플래시 색으로만 쓰입니다
        total: 60,
        endsAt: null,
        paused: null,
        running: false,
        laps: 0,
        inPip: true,      // PIP 창에 담을지 — 카드의 PIP 버튼으로 켜고 끕니다
        doms: [],         // 이 타이머를 그리는 카드들. 본 창과 PIP 창에 한 벌씩
        lastShown: null   // 초 단위 변화 감지용 (틱 소리 중복 방지)
      });
    }

    const el = {
      grid: document.getElementById('grid'),
      toolbar: document.querySelector('.toolbar'),
      flash: document.getElementById('flash'),
      toasts: document.getElementById('toasts'),
      soundBtn: document.getElementById('sound-btn'),
      notifyBtn: document.getElementById('notify-btn'),
      pipBtn: document.getElementById('pip-btn'),
      canvas: document.getElementById('pip-canvas'),
      video: document.getElementById('pip-video')
    };

    let soundOn = true;
    let notifyOn = false;
    let wakeLock = null;

    // Document PIP 창과 그 안의 알림 표시 영역
    let pipWindow = null;
    let pipSurface = null;

    // 완료 효과를 띄울 화면 목록 — 본 창과 PIP 창 양쪽에 모두 표시합니다.
    function surfaces() {
      const list = [{ flash: el.flash, toasts: el.toasts }];
      if (pipWindow && pipSurface) list.push(pipSurface);
      return list;
    }

    function fireFlash(color) {
      surfaces().forEach(function (s) {
        s.flash.style.background = color;
        s.flash.classList.remove('on');
        void s.flash.offsetWidth;      // 애니메이션 재시작을 위한 리플로우
        s.flash.classList.add('on');
      });
    }

    /* ==========================================================
       저장 / 복원
       ========================================================== */
    function save() {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          soundOn: soundOn,
          timers: timers.map(function (t) {
            return {
              name: t.name, total: t.total,
              endsAt: t.endsAt, paused: t.paused, running: t.running,
              laps: t.laps, inPip: t.inPip
            };
          })
        }));
      } catch (e) { /* 저장 불가 환경은 무시 */ }
    }

    function restore() {
      let raw;
      try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return; }
      if (!raw) return;

      let data;
      try { data = JSON.parse(raw); } catch (e) { return; }
      if (!data || !Array.isArray(data.timers)) return;

      if (typeof data.soundOn === 'boolean') soundOn = data.soundOn;

      data.timers.forEach(function (s, i) {
        const t = timers[i];
        if (!t || !s) return;
        if (typeof s.name === 'string') t.name = s.name;
        if (typeof s.total === 'number') t.total = clampSeconds(s.total);
        if (typeof s.laps === 'number') t.laps = s.laps;
        if (typeof s.paused === 'number') t.paused = s.paused;
        if (typeof s.inPip === 'boolean') t.inPip = s.inPip;

        // 작동 중이었다면 종료 시각을 그대로 살려서 이어서 카운트합니다.
        if (s.running && typeof s.endsAt === 'number' && t.total > 0) {
          t.endsAt = s.endsAt;
          t.running = true;
        }
      });
    }

    /* ==========================================================
       유틸
       ========================================================== */
    function clampSeconds(v) {
      v = Math.floor(Number(v) || 0);
      if (v < 0) v = 0;
      if (v > MAX_SECONDS) v = MAX_SECONDS;
      return v;
    }

    function remainingOf(t) {
      if (t.running) return Math.max(0, Math.ceil((t.endsAt - Date.now()) / 1000));
      if (t.paused !== null) return t.paused;
      return t.total;
    }

    function pad2(n) { return n < 10 ? '0' + n : String(n); }

    function splitTime(sec) {
      return { m: pad2(Math.floor(sec / 60)), s: pad2(sec % 60) };
    }

    function levelOf(t, remain) {
      if (!t.running) return 'idle';
      if (remain <= CRITICAL_AT) return 'critical';
      if (remain <= DANGER_AT) return 'danger';
      if (remain <= WARN_AT) return 'warn';
      return 'running';
    }

    /* ==========================================================
       소리 — 외부 파일 없이 Web Audio로 직접 만듭니다.
       ========================================================== */
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, dur, delay, type, vol) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const at = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, at);
      // 클릭음이 나지 않도록 부드럽게 열고 닫습니다.
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(vol || 0.12, at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(at);
      osc.stop(at + dur + 0.03);
    }

    // 남은 10초부터 매초 울리는 짧은 초읽기 신호
    function playTick() {
      if (!soundOn) return;
      tone(1180, 0.06, 0, 'square', 0.07);
    }

    // 완료 알람 — 빠른 4연타 후 낮게 울리는 마무리음
    function playAlarm() {
      if (!soundOn) return;
      for (let i = 0; i < 4; i++) tone(1568, 0.11, i * 0.16, 'square', 0.16);
      tone(784, 0.5, 0.72, 'triangle', 0.16);
    }

    /* ==========================================================
       완료 처리 — 플래시 + 알람 + 토스트 + 브라우저 알림
       ========================================================== */
    function onComplete(t) {
      playAlarm();

      // 화면 전체 플래시 (해당 타이머 색으로)
      fireFlash(t.color);

      // 카드 튀는 효과.
      // 끝나면 반드시 클래스를 떼야 합니다. 남아 있으면 .card.done 의 animation 이
      // .card.danger 의 테두리 맥동을 계속 덮어써서 이후 경고가 죽습니다.
      const cards = t.doms.map(function (d) { return d.card; });
      cards.forEach(function (card) {
        card.classList.remove('done');
        void card.offsetWidth;
        card.classList.add('done');
      });
      clearTimeout(t.doneTimer);
      t.doneTimer = setTimeout(function () {
        cards.forEach(function (card) { card.classList.remove('done'); });
      }, 650);

      showToast(t);

      if (notifyOn && 'Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification('⏰ ' + t.name + ' 완료!', {
            body: '다시 처음부터 반복합니다. (' + t.laps + '회째)',
            tag: 'yuhok-' + t.id,
            renotify: true
          });
        } catch (e) { /* 일부 브라우저는 생성자 알림을 막습니다 */ }
      }
    }

    function showToast(t) {
      const html = '<span>⏰</span><span><b>' + escapeHtml(t.name) +
                   '</b> 시간이 끝났습니다 · ' + t.laps + '회째</span>';
      surfaces().forEach(function (s) {
        // 각 창의 document 로 만들어야 그 창에서 정상적으로 렌더링됩니다.
        const doc = s.toasts.ownerDocument;
        const div = doc.createElement('div');
        div.className = 'toast';
        div.style.setProperty('--accent', t.color);
        div.innerHTML = html;
        s.toasts.appendChild(div);
        setTimeout(function () { div.remove(); }, 4200);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ==========================================================
       타이머 조작
       ========================================================== */
    function start(t) {
      if (t.running) return;
      const from = (t.paused !== null && t.paused > 0) ? t.paused : t.total;
      if (from <= 0) return;                 // 0초짜리는 시작하지 않습니다
      t.endsAt = Date.now() + from * 1000;
      t.paused = null;
      t.running = true;
      t.lastShown = null;
      ensureAudio();                         // 첫 조작에서 소리 사용 권한을 확보합니다
      requestWakeLock();
      save();
      renderAll();
    }

    function pause(t) {
      if (!t.running) return;
      t.paused = remainingOf(t);
      t.running = false;
      t.endsAt = null;
      save();
      renderAll();
    }

    // 멈추고 시간을 0으로 지웁니다.
    function clearTime(t) {
      t.running = false;
      t.endsAt = null;
      t.paused = null;
      t.laps = 0;
      t.lastShown = null;
      clearTimeout(t.doneTimer);
      t.doms.forEach(function (d) { d.card.classList.remove('done'); });
      setTotal(t, 0);   // 저장과 다시 그리기는 setTotal 이 합니다
    }

    // 설정한 시간의 처음으로 되돌리고 곧바로 다시 셉니다.
    // 3분짜리가 10초 남았을 때 누르면 3분부터 다시 시작합니다.
    function restart(t) {
      if (t.total <= 0) return;
      t.endsAt = Date.now() + t.total * 1000;
      t.paused = null;
      t.running = true;
      t.laps = 0;
      t.lastShown = null;
      clearTimeout(t.doneTimer);
      t.doms.forEach(function (d) { d.card.classList.remove('done'); });
      ensureAudio();
      requestWakeLock();
      save();
      renderAll();
    }

    function setTotal(t, sec) {
      t.total = clampSeconds(sec);
      if (t.running) {
        // 작동 중에 시간을 바꾸면 즉시 새 시간으로 다시 셉니다.
        // (다음 바퀴까지 기다리게 하면 눌러도 반응이 없는 것처럼 보입니다)
        t.endsAt = t.total > 0 ? Date.now() + t.total * 1000 : null;
        if (t.total <= 0) { t.running = false; }
        t.lastShown = null;
      } else {
        // 대기 중이면 새 설정값이 바로 보이도록 일시정지 상태를 비웁니다.
        t.paused = null;
      }
      save();
      renderAll();
    }

    /* ==========================================================
       카드 생성
       ========================================================== */
    // doc 을 받아 본 창에도, PIP 창에도 같은 카드를 만듭니다.
    function buildCard(t, doc) {
      const card = doc.createElement('section');
      card.className = 'card idle';

      /* --- 헤더 --- */
      const head = doc.createElement('div');
      head.className = 'card-head';

      const name = doc.createElement('input');
      name.className = 'name';
      name.type = 'text';
      name.value = t.name;
      name.maxLength = 14;
      name.setAttribute('aria-label', '타이머 이름');
      name.addEventListener('input', function () {
        t.name = name.value || '타이머 ' + t.id;
        fitName(t);
        applyPipPick(t);   // 읽어 주는 이름표도 함께 갱신
        save();
      });

      const laps = doc.createElement('span');
      laps.className = 'laps';

      const pick = doc.createElement('button');
      pick.className = 'pip-pick';
      pick.type = 'button';
      pick.innerHTML =
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="2" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="2" y="4" width="20" height="16"></rect>' +
        '<rect x="12" y="12" width="8" height="6" fill="currentColor"></rect></svg>';
      pick.addEventListener('click', function () {
        t.inPip = !t.inPip;
        applyPipPick(t);
        save();
      });

      head.append(name, laps, pick);

      /* --- 시간 표시 (자릿수 타일) --- */
      const digits = doc.createElement('div');
      digits.className = 'digits';
      digits.setAttribute('aria-label', '남은 시간 · 분과 초를 직접 칠 수 있습니다');

      const dm1 = mkDigit(doc), dm2 = mkDigit(doc);
      const colon = doc.createElement('span');
      colon.className = 'colon';
      colon.textContent = ':';
      const ds1 = mkDigit(doc), ds2 = mkDigit(doc);
      digits.append(dm1, dm2, colon, ds1, ds2);

      // 네모 안에 숫자를 바로 칩니다. 한 칸을 채우면 다음 칸으로 넘어갑니다.
      const boxes = [dm1, dm2, ds1, ds2];

      function readBoxes() {
        const v = boxes.map(function (b) {
          const c = (b.value || '0').replace(/\D/g, '').slice(-1);
          return c === '' ? '0' : c;
        });
        setTotal(t, (Number(v[0]) * 10 + Number(v[1])) * 60 + Number(v[2]) * 10 + Number(v[3]));
      }

      boxes.forEach(function (box, i) {
        box.addEventListener('focus', function () { box.select(); });
        box.addEventListener('input', function () {
          const digit = (box.value || '').replace(/\D/g, '').slice(-1);
          box.value = digit;
          if (digit && i < boxes.length - 1) {
            boxes[i + 1].focus();
            boxes[i + 1].select();
          }
          if (digit) readBoxes();
        });
        box.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
            e.preventDefault();
            setTotal(t, t.total + (e.key === 'ArrowUp' ? 1 : -1));
            return;
          }
          if (e.key === 'ArrowLeft' && i > 0) { e.preventDefault(); boxes[i - 1].focus(); boxes[i - 1].select(); }
          if (e.key === 'ArrowRight' && i < boxes.length - 1) { e.preventDefault(); boxes[i + 1].focus(); boxes[i + 1].select(); }
          if (e.key === 'Backspace' && !box.value && i > 0) { e.preventDefault(); boxes[i - 1].focus(); boxes[i - 1].select(); }
        });
        box.addEventListener('blur', function () {
          if (!box.value) readBoxes();   // 비워 둔 칸은 0으로 되돌립니다
        });
      });

      /* --- 진행바 --- */
      const bar = doc.createElement('div');
      bar.className = 'bar';
      const fill = doc.createElement('div');
      fill.className = 'bar-fill';
      bar.appendChild(fill);

      /* --- 빠른 선택 칩 --- */
      const chips = doc.createElement('div');
      chips.className = 'chips';
      const chipEls = PRESETS.map(function (p) {
        const c = doc.createElement('button');
        c.className = 'chip';
        c.type = 'button';
        c.textContent = p.label;
        c.dataset.sec = p.sec;
        c.addEventListener('click', function () { setTotal(t, p.sec); });
        chips.appendChild(c);
        return c;
      });

      /* --- 미세 조절 (±1 · ±3 · ±5초) --- */
      const steps = doc.createElement('div');
      steps.className = 'steps';

      // −묶음과 +묶음을 따로 둡니다. PIP에서는 이 둘 사이에 재생 버튼이 들어갑니다.
      const minusGrp = doc.createElement('div');
      minusGrp.className = 'steps-grp minus';
      const plusGrp = doc.createElement('div');
      plusGrp.className = 'steps-grp plus';
      steps.append(minusGrp, plusGrp);

      const stepEls = STEPS.map(function (delta) {
        const b = doc.createElement('button');
        b.className = 'step ' + (delta > 0 ? 'plus' : 'minus');
        b.type = 'button';
        // 빼기는 하이픈이 아니라 진짜 마이너스 기호라야 +와 폭이 맞습니다
        b.textContent = (delta > 0 ? '+' : '−') + Math.abs(delta);
        b.dataset.delta = delta;
        b.title = Math.abs(delta) + '초 ' + (delta > 0 ? '늘리기' : '줄이기');
        b.setAttribute('aria-label', t.name + ' ' + b.title);
        b.addEventListener('click', function () { setTotal(t, t.total + delta); });
        (delta > 0 ? plusGrp : minusGrp).appendChild(b);
        return b;
      });

      /* --- 직접 입력 --- */
      const manual = doc.createElement('div');
      manual.className = 'manual';

      const min = doc.createElement('input');
      min.type = 'number'; min.min = 0; min.max = 60; min.inputMode = 'numeric';
      min.setAttribute('aria-label', '분');
      const minLabel = doc.createElement('label'); minLabel.textContent = '분';

      const sec = doc.createElement('input');
      sec.type = 'number'; sec.min = 0; sec.max = 59; sec.inputMode = 'numeric';
      sec.setAttribute('aria-label', '초');
      const secLabel = doc.createElement('label'); secLabel.textContent = '초';

      function readManual() {
        const m = Math.max(0, Math.floor(Number(min.value) || 0));
        const s = Math.max(0, Math.floor(Number(sec.value) || 0));
        setTotal(t, m * 60 + s);
      }
      min.addEventListener('change', readManual);
      sec.addEventListener('change', readManual);

      manual.append(min, minLabel, sec, secLabel);

      /* --- 컨트롤 --- */
      const controls = doc.createElement('div');
      controls.className = 'controls';

      const mainBtn = doc.createElement('button');
      mainBtn.className = 'btn-main';
      mainBtn.type = 'button';
      // 아이콘과 글자를 따로 담습니다 — 압축 PIP에서는 .lbl 만 숨겨 아이콘 버튼이 됩니다
      const mainIco = doc.createElement('span');
      mainIco.className = 'ico';
      const mainLbl = doc.createElement('span');
      mainLbl.className = 'lbl';
      mainBtn.append(mainIco, mainLbl);
      mainBtn.addEventListener('click', function () {
        if (t.running) pause(t); else start(t);
      });

      const clearBtn = doc.createElement('button');
      clearBtn.className = 'btn-clear';
      clearBtn.type = 'button';
      clearBtn.textContent = '0';
      clearBtn.title = '시간을 0으로 지우기';
      clearBtn.setAttribute('aria-label', t.name + ' 시간 지우기');
      clearBtn.addEventListener('click', function () { clearTime(t); });

      const resetBtn = doc.createElement('button');
      resetBtn.className = 'btn-reset';
      resetBtn.type = 'button';
      resetBtn.textContent = '↺';
      resetBtn.title = '처음부터 다시';
      resetBtn.setAttribute('aria-label', t.name + ' 처음부터 다시 시작');
      resetBtn.addEventListener('click', function () { restart(t); });

      controls.append(mainBtn);

      // 다시 시작 버튼은 분초 박스 바로 왼쪽에 둡니다.
      const timeRow = doc.createElement('div');
      timeRow.className = 'time-row';
      timeRow.append(clearBtn, resetBtn, digits);

      card.append(head, timeRow, bar, chips, steps, manual, controls);

      const dom = {
        card: card, name: name, laps: laps,
        dm1: dm1, dm2: dm2, ds1: ds1, ds2: ds2,
        fill: fill, chips: chipEls, steps: stepEls, pick: pick,
        min: min, sec: sec,
        mainBtn: mainBtn, mainIco: mainIco, mainLbl: mainLbl
      };
      t.doms.push(dom);
      return card;
    }

    // 이름칸 폭 — 최신 크롬은 CSS field-sizing 이 알아서 해 주고,
    // 안 되는 브라우저에만 글자 폭을 어림해 --name-w 로 넘깁니다.
    const HAS_FIELD_SIZING = !!(window.CSS && CSS.supports && CSS.supports('field-sizing', 'content'));

    function fitName(t) {
      if (HAS_FIELD_SIZING) return;
      const v = t.name || '';
      let em = 0;
      for (let i = 0; i < v.length; i++) {
        // 한글·전각은 한 칸, 나머지는 반 칸 남짓으로 봅니다
        em += /[ᄀ-ᇿ㄰-㆏가-힣！-｠]/.test(v[i]) ? 1 : 0.56;
      }
      const w = Math.min(12, Math.max(3, em + 0.8)) + 'em';
      t.doms.forEach(function (d) { d.name.style.setProperty('--name-w', w); });
    }

    // PIP에 담을지 여부를 카드와 버튼에 반영합니다.
    function applyPipPick(t) {
      t.doms.forEach(function (d) {
        d.card.classList.toggle('pip-off', !t.inPip);
        d.pick.setAttribute('aria-pressed', String(t.inPip));
        d.pick.title = t.inPip ? 'PIP에서 빼기' : 'PIP에 넣기';
        d.pick.setAttribute('aria-label', t.name + (t.inPip ? ' PIP에서 빼기' : ' PIP에 넣기'));
      });
    }

    function pipCount() {
      return timers.filter(function (t) { return t.inPip; }).length;
    }

    // doc 을 받아야 PIP 창의 노드를 그 창에서 만듭니다.
    function mkDigit(doc) {
      const d = doc.createElement('input');
      d.className = 'd';
      d.type = 'text';
      d.inputMode = 'numeric';
      d.maxLength = 1;
      d.autocomplete = 'off';
      d.value = '0';
      return d;
    }

    /* ==========================================================
       화면 갱신
       ========================================================== */
    function renderAll() {
      let soonest = null;
      let soonestName = '';

      timers.forEach(function (t) {
        const remain = remainingOf(t);
        const parts = splitTime(remain);
        const level = levelOf(t, remain);
        const pct = t.total > 0 ? (remain / t.total) * 100 : 0;
        const mv = String(Math.floor(t.total / 60));
        const sv = String(t.total % 60);

        // 같은 상태를 본 창 카드와 PIP 창 카드에 똑같이 그립니다.
        t.doms.forEach(function (dom) {

          // 숫자 — 지금 치고 있는 칸은 덮어쓰지 않습니다
          const act = dom.dm1.ownerDocument.activeElement;
          const want = [parts.m[0], parts.m[1], parts.s[0], parts.s[1]];
          [dom.dm1, dom.dm2, dom.ds1, dom.ds2].forEach(function (box, i) {
            if (box !== act && box.value !== want[i]) box.value = want[i];
          });

          // 진행바
          dom.fill.style.width = pct + '%';

          // 상태 클래스
          dom.card.classList.toggle('idle', !t.running);
          dom.card.classList.toggle('paused', !t.running && t.paused !== null);
          dom.card.classList.toggle('running', t.running);
          dom.card.classList.toggle('warn', level === 'warn');
          dom.card.classList.toggle('danger', level === 'danger' || level === 'critical');
          dom.card.classList.toggle('critical', level === 'critical');

          // 버튼 문구 (아이콘과 글자가 따로라 각각 비교합니다)
          const wantIco = t.running ? '⏸' : '▶';
          const wantLbl = t.running ? '일시정지'
                        : (t.paused !== null && t.paused > 0 ? '이어서 시작' : '시작');
          if (dom.mainIco.textContent !== wantIco) dom.mainIco.textContent = wantIco;
          if (dom.mainLbl.textContent !== wantLbl) dom.mainLbl.textContent = wantLbl;

          // 미세 조절 — 0초/60분 경계를 넘는 버튼은 잠급니다
          dom.steps.forEach(function (b) {
            const next = t.total + Number(b.dataset.delta);
            b.disabled = (next < 0 || next > MAX_SECONDS);
          });

          // 반복 횟수
          const lapText = t.laps > 0 ? t.laps + '회' : '';
          if (dom.laps.textContent !== lapText) dom.laps.textContent = lapText;
          dom.laps.classList.toggle('has', t.laps > 0);

          // 입력칸 (입력 중인 칸은 건드리지 않습니다)
          // 카드가 창마다 따로 있으므로 activeElement 도 그 카드의 document 로 봅니다.
          const focused = dom.min.ownerDocument.activeElement;
          if (focused !== dom.min && dom.min.value !== mv) dom.min.value = mv;
          if (focused !== dom.sec && dom.sec.value !== sv) dom.sec.value = sv;
          if (focused !== dom.name && dom.name.value !== t.name) dom.name.value = t.name;

          // 선택된 칩 표시
          dom.chips.forEach(function (c) {
            c.classList.toggle('sel', Number(c.dataset.sec) === t.total);
          });
        });   // 카드마다 그리기 끝

        // 초읽기 소리 (매초 한 번만)
        if (t.running && remain <= DANGER_AT && remain > 0 && t.lastShown !== remain) {
          playTick();
        }
        if (t.running) t.lastShown = remain;

        // 탭 제목에 쓸 가장 임박한 타이머 찾기
        if (t.running && (soonest === null || remain < soonest)) {
          soonest = remain;
          soonestName = t.name;
        }
      });

      // 탭 제목 — 다른 탭을 보고 있어도 남은 시간이 보입니다.
      let wantTitle;
      if (soonest !== null) {
        const p = splitTime(soonest);
        wantTitle = p.m + ':' + p.s + ' · ' + soonestName + ' | 유혹 타이머';
      } else {
        wantTitle = '유혹 타이머';
      }
      if (document.title !== wantTitle) document.title = wantTitle;
    }

    /* ==========================================================
       메인 루프
       ========================================================== */
    function loop() {
      const now = Date.now();

      timers.forEach(function (t) {
        if (!t.running || t.total <= 0) return;

        if (now >= t.endsAt) {
          // 탭이 오래 비활성이었다면 여러 바퀴가 밀려 있을 수 있습니다.
          let rounds = 0;
          while (now >= t.endsAt && rounds < 1000) {
            t.endsAt += t.total * 1000;
            rounds++;
          }
          t.laps += rounds;
          t.lastShown = null;
          onComplete(t);
          save();
        }
      });

      renderAll();
    }

    /* ==========================================================
       화면 꺼짐 방지 (모바일에서 유용)
       ========================================================== */
    function requestWakeLock() {
      if (wakeLock || !('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (lock) {
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; });
      }).catch(function () { /* 지원하지 않으면 조용히 넘어갑니다 */ });
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') {
        if (timers.some(function (t) { return t.running; })) requestWakeLock();
        loop();   // 탭으로 돌아왔을 때 즉시 최신 상태로 맞춥니다
      }
    });

    /* ==========================================================
       PIP — 캔버스를 영상으로 만들어 항상 위에 띄웁니다.
       ========================================================== */
    const ctx = el.canvas.getContext('2d');
    let pipStream = null;
    let pipDrawing = false;   // PIP를 켰을 때만 그립니다 (평소엔 배터리 낭비)

    function startPipLoop() {
      if (pipDrawing) return;
      pipDrawing = true;
      drawPIP();
    }

    function drawPIP() {
      if (!pipDrawing) return;
      const W = el.canvas.width, H = el.canvas.height;

      ctx.fillStyle = '#1c1813';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#dcbb4c';
      ctx.font = 'bold 26px "Gulim", "굴림", "Malgun Gothic", sans-serif';
      ctx.fillText('유혹 타이머', W / 2, 34);

      let y = 62;
      const rowH = 66;

      timers.filter(function (t) { return t.inPip; }).forEach(function (t) {
        const remain = remainingOf(t);
        const level = levelOf(t, remain);
        const p = splitTime(remain);

        // 경고 상태면 행 배경을 깔아 눈에 띄게 합니다.
        if (level === 'danger' || level === 'critical') {
          const blink = Math.floor(Date.now() / 250) % 2 === 0;
          ctx.fillStyle = blink ? 'rgba(226,84,58,.85)' : 'rgba(226,84,58,.25)';
          ctx.fillRect(8, y - 4, W - 16, rowH - 10);
        }

        let color;
        if (!t.running) color = '#6a5c46';
        else if (level === 'critical' || level === 'danger') color = '#e2543a';
        else if (level === 'warn') color = '#f0a63c';
        else color = t.color;

        // 이름
        ctx.textAlign = 'left';
        ctx.fillStyle = t.running ? '#f6edd8' : '#6a5c46';
        ctx.font = '15px "Gulim", "굴림", "Malgun Gothic", sans-serif';
        ctx.fillText(clip(t.name, 10), 18, y + 14);

        // 남은 시간
        ctx.textAlign = 'right';
        ctx.fillStyle = color;
        ctx.font = 'bold 30px "Gulim", "굴림", "Malgun Gothic", sans-serif';
        ctx.fillText(t.running || t.paused !== null ? p.m + ':' + p.s : '--:--', W - 18, y + 20);

        // 진행바
        const barY = y + 30, barW = W - 36, barH = 7;
        ctx.fillStyle = '#100d09';
        roundRect(18, barY, barW, barH, 0);
        ctx.fill();
        if (t.total > 0) {
          const w = Math.max(0, Math.min(1, remain / t.total)) * barW;
          ctx.fillStyle = t.running ? color : '#443a2c';
          roundRect(18, barY, w, barH, 0);
          ctx.fill();
        }

        y += rowH;
      });

      requestAnimationFrame(drawPIP);
    }

    function roundRect(x, y, w, h, r) {
      if (w <= 0) { ctx.beginPath(); return; }
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function clip(s, n) {
      s = String(s);
      return s.length > n ? s.slice(0, n) + '…' : s;
    }

    async function toggleCanvasPiP() {
      if (document.pictureInPictureElement) {
        document.exitPictureInPicture();
        return;
      }
      try {
        // 담은 개수만큼 캔버스를 잡아 둡니다 — 스트림을 뜨기 전에 정해져야 합니다.
        el.canvas.height = 72 + Math.max(1, pipCount()) * 66;
        startPipLoop();                 // 스트림을 잡기 전에 캔버스가 먼저 그려져 있어야 합니다
        pipStream = el.canvas.captureStream(30);
        el.video.srcObject = pipStream;
        await el.video.play();
        await el.video.requestPictureInPicture();
      } catch (err) {
        pipDrawing = false;
        alert('PIP 모드를 지원하지 않는 브라우저이거나 오류가 발생했습니다.\n' + err);
      }
    }

    /* ==========================================================
       Document PIP — 캔버스 영상이 아니라 실제 화면을 통째로 옮깁니다.
       복제가 아니라 '이동'이라서 PIP 창 안에서도 시간 변경·시작·정지가
       전부 그대로 동작합니다. (Chrome / Edge 116+)
       ========================================================== */
    const supportsDocPiP = ('documentPictureInPicture' in window);

    function togglePIP() {
      if (supportsDocPiP) return toggleDocPiP();
      return toggleCanvasPiP();     // 미지원 브라우저는 기존 영상 방식으로 대체
    }

    async function toggleDocPiP() {
      if (pipWindow) { pipWindow.close(); return; }   // 정리는 pagehide 에서 합니다

      // 한 줄 배치에 필요한 폭 = 이름 + 남은시간 + 조절 6칸 + 재생 + 리셋.
      // 더 좁히면 이름칸부터 줄고, 그다음엔 버튼이 다음 줄로 접힙니다.
      // 높이 = 여백 + 툴바 한 줄 + (담은 줄 56 · 뺀 줄 28) × 개수.
      const shown = pipCount();
      const hidden = timers.length - shown;
      const size = {
        width: 560,
        height: Math.max(150, 20 + 40 + shown * 56 + hidden * 28)
      };

      let win;
      try {
        win = await window.documentPictureInPicture.requestWindow(size);
      } catch (err) {
        alert('PIP 창을 열지 못했습니다.\n' + err);
        return;
      }

      pipWindow = win;
      const doc = win.document;
      doc.documentElement.lang = 'ko';
      doc.title = '유혹 타이머';
      copyStylesTo(doc);
      doc.body.classList.add('pip-mode');

      // 완료 플래시·토스트를 PIP 창에도 띄우기 위한 영역
      const pf = doc.createElement('div'); pf.id = 'flash';
      const pt = doc.createElement('div'); pt.id = 'toasts';
      doc.body.append(pf, pt);
      pipSurface = { flash: pf, toasts: pt };

      // 본 화면은 그대로 두고, PIP 창에 같은 타이머를 한 벌 더 만듭니다.
      // 상태(timers)를 공유하므로 어느 쪽에서 눌러도 양쪽이 함께 움직입니다.
      const bar = doc.createElement('div');
      bar.className = 'toolbar';
      [['▶ 전체 시작', function () { timers.forEach(start); }],
       ['⏸ 전체 정지', function () { timers.forEach(pause); }],
       ['↺ 전체 다시 시작', function () { timers.forEach(restart); }]
      ].forEach(function (item) {
        const b = doc.createElement('button');
        b.className = 'btn';
        b.type = 'button';
        b.textContent = item[0];
        b.addEventListener('click', item[1]);
        bar.appendChild(b);
      });

      const grid = doc.createElement('main');
      grid.className = 'grid';
      timers.forEach(function (t) { grid.appendChild(buildCard(t, doc)); });

      doc.body.append(bar, grid);
      timers.forEach(applyPipPick);
      timers.forEach(fitName);

      win.addEventListener('pagehide', restoreFromDocPiP);
      el.pipBtn.classList.add('on');
      el.pipBtn.textContent = '📺 PIP 닫기';
      renderAll();
    }

    function restoreFromDocPiP() {
      if (!pipWindow) return;

      // PIP 창에 만들었던 카드만 목록에서 뗍니다. 본 창 카드는 그대로 있습니다.
      timers.forEach(function (t) {
        t.doms = t.doms.filter(function (d) { return d.card.ownerDocument === document; });
      });

      pipSurface = null;
      pipWindow = null;
      el.pipBtn.classList.remove('on');
      el.pipBtn.textContent = '📺 PIP (항상 위)';
      renderAll();
    }

    // 본 문서의 스타일(폰트 링크 + style 태그)을 PIP 창으로 복사합니다.
    function copyStylesTo(doc) {
      document.querySelectorAll('link[rel="stylesheet"]').forEach(function (link) {
        doc.head.appendChild(link.cloneNode(true));
      });
      document.querySelectorAll('style').forEach(function (style) {
        const copy = doc.createElement('style');
        copy.textContent = style.textContent;
        doc.head.appendChild(copy);
      });
    }

    /* ==========================================================
       툴바
       ========================================================== */
    el.pipBtn.addEventListener('click', togglePIP);

    // PIP 창을 닫으면 그리기를 멈춥니다.
    el.video.addEventListener('leavepictureinpicture', function () {
      pipDrawing = false;
      el.pipBtn.classList.remove('on');
    });
    el.video.addEventListener('enterpictureinpicture', function () {
      el.pipBtn.classList.add('on');
    });

    document.getElementById('start-all').addEventListener('click', function () {
      timers.forEach(start);
    });
    document.getElementById('stop-all').addEventListener('click', function () {
      timers.forEach(pause);
    });
    document.getElementById('reset-all').addEventListener('click', function () {
      timers.forEach(restart);
    });
    document.getElementById('clear-all').addEventListener('click', function () {
      timers.forEach(clearTime);
    });

    el.soundBtn.addEventListener('click', function () {
      soundOn = !soundOn;
      el.soundBtn.classList.toggle('on', soundOn);
      el.soundBtn.setAttribute('aria-pressed', String(soundOn));
      el.soundBtn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
      if (soundOn) { ensureAudio(); tone(880, 0.09, 0, 'triangle', 0.12); }
      save();
    });

    el.notifyBtn.addEventListener('click', function () {
      if (!('Notification' in window)) {
        alert('이 브라우저는 알림을 지원하지 않습니다.');
        return;
      }
      if (Notification.permission === 'granted') {
        notifyOn = !notifyOn;
        syncNotifyBtn();
        return;
      }
      Notification.requestPermission().then(function (res) {
        notifyOn = (res === 'granted');
        syncNotifyBtn();
        if (res === 'denied') alert('브라우저에서 알림이 차단되어 있습니다. 주소창 왼쪽 자물쇠 아이콘에서 허용해 주세요.');
      });
    });

    function syncNotifyBtn() {
      el.notifyBtn.classList.toggle('on', notifyOn);
      el.notifyBtn.textContent = notifyOn ? '🔔 알림 켜짐' : '🔔 알림 켜기';
    }

    // 어디를 누르든 첫 조작에서 오디오를 깨웁니다 (브라우저 자동재생 정책 대응)
    document.addEventListener('pointerdown', function once() {
      ensureAudio();
      document.removeEventListener('pointerdown', once);
    });

    /* ==========================================================
       시작
       ========================================================== */
    restore();

    el.soundBtn.classList.toggle('on', soundOn);
    el.soundBtn.textContent = soundOn ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
    if ('Notification' in window && Notification.permission === 'granted') {
      notifyOn = true;
    }
    syncNotifyBtn();

    timers.forEach(function (t) { el.grid.appendChild(buildCard(t, document)); });
    timers.forEach(applyPipPick);   // 카드가 만들어진 뒤라야 상태를 반영할 수 있습니다
    timers.forEach(fitName);

    renderAll();
    setInterval(loop, 200);
  })();
  </script>
</body>
</html>
